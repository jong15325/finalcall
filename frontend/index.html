<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!--
      interactive-widget=resizes-content — 모바일에서 소프트 키보드가 올라오면 레이아웃 뷰포트가 함께
      줄어든다. 인증 화면의 sticky CTA(AuthStickyActions)가 키보드 바로 위에 앉게 하는 전제다.
      기본값(resizes-visual)이면 레이아웃 뷰포트가 그대로라 sticky 요소가 키보드 뒤에 남는다.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <title>FinalCall</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

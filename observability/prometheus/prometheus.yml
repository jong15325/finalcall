# Stage G: Prometheus 스크래이핑 설정. 호스트에서 실행되는 앱의 /actuator/prometheus 를 긁는다.
global:
  scrape_interval: 10s          # 개발용 적정값(5~15s). 운영은 부하/보존 고려해 조정.

scrape_configs:
  - job_name: 'finalcall'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # ★ 앱은 컴포즈 밖(호스트)에서 실행되므로 host.docker.internal 로 호스트에 접근한다.
      - targets: ['host.docker.internal:8080']
    # ★ prod 에서는 management 포트 분리(Stage 5, 8081)에 맞춰 target 포트를 8081 로 조정하라.

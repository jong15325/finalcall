<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>마켓 즉시구매 · 카드정보 UI 차용 목업 (FC-145)</title>
<!--
════════════════════════════════════════════════════════════════════════════════
  FC-145 — 마켓 즉시구매 (카드정보 UI 차용) HTML 목업 · 디자인 게이트 제출물
  ※ 실 React 구현 아님. HTML/CSS + 최소 JS 로 인터랙션만 시연. 실 구현은 FC-146.
  참조: docs/game_ui/card_info/카드정보-특수스킬.png (다크블루 패널·랭크뱃지·속성표·탭·스킬목록)
        POST /shops/{id}/purchase (FC-094) · ShopSummary/ShopDetail 필드
────────────────────────────────────────────────────────────────────────────────
  ▣ 디자인 게이트 3결정 — 목업이 렌더하는 "권장안"과 근거

  (1) 모달 vs 인라인 확장  →  【권장: 모달 팝업】
      - 근거: 카드정보(CARD INFO)는 원게임에서도 별도 팝업 창(wnd_cardinfo)이다. 목록 흐름을
        끊지 않고 아이템 위에 겹쳐 띄우는 모달이 원본 UX·차용 aesthetic 모두에 가장 충실하다.
      - 목록 스크롤 위치가 보존되고, 여러 카드를 빠르게 열고 닫으며 비교·구매하기 좋다(즉시구매 동선).
      - 대안(인라인 아코디언 확장): 그리드가 밀려 목록 리듬이 깨지고, 좁은 카드정보 패널을
        그리드 폭에 맞춰 늘리면 게임 톤이 무너진다. 모바일에선 특히 세로로 과도하게 길어진다.

  (2) 게임 다크패널 충실 vs 앱 커머스 톤 적응  →  【권장: 하이브리드(모달 안=게임 톤 충실 / 바깥=앱 톤)】
      - 근거: 사용자가 게임 aesthetic 차용을 명시. 모달 내부(카드정보 패널)는 다크블루+골드 베벨·
        속성표·탭·스킬 목록을 원본에 충실히 재현해 "게임 카드를 그대로 가져왔다"는 사실감을 준다.
      - 단, 최종 액션인 '구매' CTA만 브랜드 오렌지로 처리해 앱의 커머스 문법(주요 액션=오렌지)과
        연결한다. 원본의 '상점에 팔기 / 포스충전' 버튼 자리를 '가격 + 큰 구매 버튼'으로 대체한다.
      - 모달 바깥(마켓 그리드·헤더·잔액칩)은 앱 브랜드 토큰(네이비/골드/오렌지·화이트 서피스)을
        그대로 유지 → 게임 톤은 아이템 카드정보에만 국한(frontend-design-principles: "게임은 아이템만").

  (3) 상세페이지 대체 여부  →  【권장: 대체(목록에서 바로 구매)】
      - 근거: 고정가는 협상·카운트다운이 없어 상세 페이지에 담을 추가 정보가 적다. 카드정보 모달이
        속성·스킬·가격·구매를 모두 담으므로 /market/:id 네비게이션 없이 목록에서 완결된다.
      - /market/:id 는 딥링크·공유용 seam 으로 남겨둘 수 있으나(범위 밖), 주 동선은 모달 즉시구매.

  ▣ 반응형 — 웹/모바일 별도 레이아웃 (responsive-separate-design)
      - 웹(≥1024): 모달 = 중앙 팝업, 내부 2열(카드 썸네일 | 속성표). 그리드 6열.
      - 모바일(≤640): 모달 = 하단 시트(전체폭), 내부 1열(썸네일 상단 중앙), 구매 바 화면 하단 고정.
        그리드 2열. 구매 버튼 full-width·큰 터치 타깃(≥48px)로 안 깨지게.
════════════════════════════════════════════════════════════════════════════════
-->
<style>
  /* ── 브랜드 토큰 (frontend/src/index.css @layer theme 값 인라인) ── */
  :root {
    --navy: #16213a; --navy-900: #101a2e; --navy-800: #1b2a47; --navy-700: #223458;
    --navy-600: #2c4270; --navy-500: #385189;
    --gold: #c8a028; --gold-bright: #dfc447; --gold-deep: #8b6100; --gold-subtle: #f6edcd;
    --orange: #ef8a2c; --orange-deep: #d9741a; --orange-subtle: #fdefe0;
    --surface: #ffffff; --surface-sunken: #f4f5f8; --line: #e4e7ee;
    --success: #16a34a; --success-subtle: #dcfce7; --danger: #e11d48; --danger-subtle: #ffe4e6;
    --gray-100: #f1f3f7; --gray-200: #e4e7ee; --gray-300: #cfd4de; --gray-400: #9aa3b2;
    --gray-500: #6b7484; --gray-600: #4d5461; --gray-700: #3a3f4a; --gray-900: #171a20;

    /* 게임 카드정보 패널 전용 톤 (참조 이미지 실측 근사) */
    --ci-frame: #b9862e;        /* 골드 베벨 외곽 */
    --ci-frame-hi: #f4d98a;
    --ci-bg-top: #2a3f6b;       /* 패널 상단 밝은 블루 */
    --ci-bg-bot: #16264b;       /* 패널 하단 어두운 블루 */
    --ci-inset: #0f1d3c;        /* 스킬 목록 등 인셋 */
    --ci-label: #c9b58a;        /* 속성 라벨(탄/골드) */
    --ci-value: #eef3ff;        /* 값 화이트 */
    --ci-line: #3a4f7d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: Pretendard, "Noto Sans KR", ui-sans-serif, system-ui, -apple-system,
      "Segoe UI", Roboto, sans-serif;
    background: var(--surface-sunken);
    color: var(--gray-900);
    -webkit-font-smoothing: antialiased;
  }
  img { display: block; }
  button { font-family: inherit; cursor: pointer; }

  /* ═══ 앱 셸 (모달 바깥 = 브랜드 앱 톤) ═══ */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 0 20px; height: 56px;
    background: var(--navy); color: #fff;
    position: sticky; top: 0; z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; letter-spacing: -.3px; }
  .brand .mark {
    width: 26px; height: 26px; border-radius: 7px;
    background: linear-gradient(135deg, var(--gold-bright), var(--gold-deep));
    display: grid; place-items: center; color: var(--navy-900); font-size: 13px; font-weight: 900;
  }
  .wallet {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.18);
    padding: 6px 12px; border-radius: 10px; font-size: 13px; font-weight: 600;
  }
  .wallet b { color: var(--gold-bright); }

  .page { max-width: 1280px; margin: 0 auto; padding: 20px 20px 80px; }
  .page-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .page-head h1 { margin: 0; font-size: 24px; font-weight: 800; color: var(--gray-900); }
  .page-head p { margin: 4px 0 0; font-size: 13px; color: var(--gray-500); }
  .btn-sell {
    background: var(--orange); color: #fff; border: 0; border-radius: 10px;
    padding: 10px 16px; font-size: 13px; font-weight: 800;
  }
  .btn-sell:hover { background: var(--orange-deep); }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
  .chip {
    border: 1px solid var(--line); background: var(--surface); color: var(--gray-600);
    padding: 7px 14px; border-radius: 999px; font-size: 12px; font-weight: 600;
  }
  .chip.on { background: var(--navy); color: #fff; border-color: var(--navy); }

  .result-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .result-row .count { font-size: 12px; color: var(--gray-500); }
  .balance-chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); background: var(--surface); color: var(--gray-700);
    padding: 6px 12px; border-radius: 10px; font-size: 12px; font-weight: 600;
  }
  .balance-chip b { color: var(--gray-900); }
  .balance-chip.low b { color: var(--danger); }

  /* ═══ 마켓 카드 그리드 (앱 브랜드 톤·세로 카드) ═══ */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 640px)  { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 1024px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  @media (min-width: 1200px) { .grid { grid-template-columns: repeat(6, 1fr); } }

  .card {
    position: relative; display: flex; flex-direction: column; overflow: hidden;
    border: 1px solid var(--line); border-radius: 14px; background: var(--surface);
    transition: transform .12s, box-shadow .12s; cursor: pointer;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(17,26,44,.12); }
  .card:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
  .card__art {
    position: relative; aspect-ratio: 72 / 120;
    background: radial-gradient(120% 90% at 50% 20%, #26365c 0%, #131f38 70%);
    display: grid; place-items: center; overflow: hidden;
  }
  .card__art img { width: 62%; height: auto; image-rendering: pixelated; filter: drop-shadow(0 4px 8px rgba(0,0,0,.5)); }
  .rank {
    position: absolute; top: 6px; left: 6px; width: 22px; height: 24px;
    display: grid; place-items: center; font-size: 12px; font-weight: 900; color: #fff;
    border-radius: 5px; box-shadow: 0 1px 2px rgba(0,0,0,.4); text-shadow: 0 1px 1px rgba(0,0,0,.5);
  }
  .rank.S { background: linear-gradient(160deg,#f0b23a,#b4720e); }
  .rank.A { background: linear-gradient(160deg,#c66bff,#7a2ecc); }
  .rank.B { background: linear-gradient(160deg,#4aa3ff,#1f5fbf); }
  .rank.C { background: linear-gradient(160deg,#9aa3b2,#5b6472); }
  .lvl {
    position: absolute; bottom: 6px; left: 6px; padding: 2px 7px; border-radius: 5px;
    background: rgba(0,0,0,.55); color: var(--gold-bright); font-size: 11px; font-weight: 800;
  }
  .card__buy {
    position: absolute; inset: auto 6px 6px auto; opacity: 0; transform: translateY(4px);
    transition: opacity .12s, transform .12s;
    background: var(--orange); color: #fff; border: 0; border-radius: 8px;
    padding: 6px 10px; font-size: 11px; font-weight: 800;
  }
  .card:hover .card__buy, .card:focus-within .card__buy { opacity: 1; transform: translateY(0); }
  .card__body { padding: 10px; display: flex; flex-direction: column; gap: 3px; }
  .card__type { font-size: 13px; font-weight: 800; color: var(--gray-900); }
  .card__sub { font-size: 11px; color: var(--gray-500); }
  .card__skill { font-size: 11px; color: var(--gray-400); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card__price { margin-top: 6px; font-size: 15px; font-weight: 800; color: var(--gray-900); }
  .card__price .u { font-size: 11px; color: var(--gray-500); font-weight: 600; }
  .ebadge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 10px; font-weight: 800; }
  .e-water { background: #dbeafe; color: #1d4ed8; }
  .e-fire  { background: #ffe1d6; color: #d9451a; }
  .e-earth { background: #f3e6cf; color: #9a6b12; }
  .e-wind  { background: #d8f3e0; color: #157a3a; }

  /* ═══════════ 카드정보 모달 (게임 다크패널 충실 차용) ═══════════ */
  .overlay {
    position: fixed; inset: 0; z-index: 50; display: none;
    align-items: center; justify-content: center; padding: 20px;
    background: rgba(8,13,26,.62); backdrop-filter: blur(2px);
  }
  .overlay.open { display: flex; }

  .cardinfo {
    width: 100%; max-width: 760px; max-height: 92vh; overflow: hidden;
    border-radius: 16px; position: relative;
    background: linear-gradient(180deg, var(--ci-bg-top), var(--ci-bg-bot));
    border: 2px solid var(--ci-frame);
    box-shadow: 0 0 0 1px var(--ci-frame-hi) inset, 0 30px 80px rgba(4,10,24,.6);
    color: var(--ci-value);
    display: flex; flex-direction: column;
  }
  /* 타이틀 바 */
  .ci-title {
    display: flex; align-items: center; gap: 8px; padding: 10px 14px;
    background: linear-gradient(180deg,#22335c,#16244a);
    border-bottom: 1px solid var(--ci-frame);
  }
  .ci-title .ico { width: 20px; height: 20px; border-radius: 5px; background: linear-gradient(160deg,var(--gold-bright),var(--gold-deep)); }
  .ci-title h2 { margin: 0; font-size: 15px; font-weight: 900; letter-spacing: .5px; }
  .ci-title h2 small { font-size: 11px; color: var(--ci-label); font-weight: 700; margin-left: 6px; letter-spacing: 1px; }
  .ci-x {
    margin-left: auto; width: 26px; height: 26px; border-radius: 6px; border: 1px solid #7a2020;
    background: linear-gradient(180deg,#c0392b,#8e2116); color: #fff; font-size: 15px; font-weight: 900; line-height: 1;
  }
  .ci-x:hover { filter: brightness(1.1); }

  /* overflow-y:auto 는 overflow-x 를 auto 로 전이시켜 유령 가로 스크롤을 만든다 → 명시적으로 hidden. */
  .ci-scroll { overflow-y: auto; overflow-x: hidden; padding: 16px; }

  /* 상단 2열: 썸네일 | 속성표 */
  .ci-head { display: grid; grid-template-columns: 150px 1fr; gap: 16px; }
  .ci-thumb {
    position: relative; border-radius: 10px; aspect-ratio: 3/4;
    background: radial-gradient(120% 90% at 50% 25%, #33477a 0%, #0d1a38 72%);
    border: 1px solid var(--ci-frame); display: grid; place-items: center; overflow: hidden;
  }
  .ci-thumb img { width: 70%; image-rendering: pixelated; filter: drop-shadow(0 6px 12px rgba(0,0,0,.55)); }
  .ci-thumb .rank { top: 8px; left: 8px; width: 26px; height: 28px; font-size: 14px; }
  .ci-thumb .lvl { bottom: 8px; left: 8px; font-size: 12px; }

  .ci-attrs { display: flex; flex-direction: column; justify-content: center; gap: 0; }
  .ci-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 8px 2px; border-bottom: 1px solid var(--ci-line); font-size: 13px;
  }
  .ci-row:last-child { border-bottom: 0; }
  .ci-row .k { color: var(--ci-label); font-weight: 700; }
  .ci-row .v { color: var(--ci-value); font-weight: 700; text-align: right; }
  .ci-row .v.el-fire { color: #ff9a5a; } .ci-row .v.el-water { color: #6db4ff; }
  .ci-row .v.el-earth { color: #e6b24a; } .ci-row .v.el-wind { color: #66d69a; }
  .ci-row .v.gf-off { color: #8b97b3; }

  /* 탭 */
  .ci-tabs { display: flex; gap: 4px; margin: 16px 0 0; }
  .ci-tab {
    flex: 1; padding: 9px 4px; font-size: 12px; font-weight: 800; color: var(--ci-label);
    background: linear-gradient(180deg,#24365e,#182a52); border: 1px solid var(--ci-line);
    border-bottom: 0; border-radius: 8px 8px 0 0;
  }
  .ci-tab.on { color: #fff; background: var(--ci-inset); box-shadow: 0 -2px 0 var(--gold) inset; }

  .ci-panel {
    background: var(--ci-inset); border: 1px solid var(--ci-line); border-radius: 0 0 10px 10px;
    padding: 14px; min-height: 118px;
  }
  .ci-panel h3 { margin: 0 0 8px; font-size: 12px; color: var(--ci-label); font-weight: 800; letter-spacing: .3px; }
  .skill-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .skill-list li { display: flex; gap: 10px; align-items: baseline; font-size: 13.5px; color: #dbe6ff; }
  .skill-list .n {
    flex: none; width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center;
    background: linear-gradient(160deg,#3a5490,#243a6a); color: var(--gold-bright);
    font-size: 12px; font-weight: 900; border: 1px solid var(--ci-line);
  }
  .skill-list .pct { color: #66d69a; font-weight: 800; }
  .kv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; font-size: 13px; }
  .kv-grid div { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--ci-line); padding-bottom: 5px; }
  .kv-grid .k { color: var(--ci-label); } .kv-grid .v { color: #dbe6ff; font-weight: 700; }
  .muted-note { font-size: 12.5px; color: #98a6c9; line-height: 1.6; margin: 0; }

  .ci-spec { margin: 12px 0 0; font-size: 12px; color: #9fb0d6; line-height: 1.5; }

  /* 하단 액션: 가격 + 큰 구매 버튼 (원본 '상점에 팔기/포스충전' 대체) */
  .ci-foot {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px;
    background: linear-gradient(180deg,#15244a,#0f1c3b); border-top: 1px solid var(--ci-frame);
  }
  .ci-price { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .ci-price .lbl { font-size: 11px; color: var(--ci-label); font-weight: 700; }
  .ci-price .amt { font-size: 22px; font-weight: 900; color: #fff; line-height: 1; }
  .ci-price .amt .u { font-size: 12px; color: var(--ci-label); font-weight: 700; margin-left: 3px; }
  .ci-price .seller { font-size: 11px; color: #8ea0c6; }
  .ci-buy {
    margin-left: auto; flex: none; min-width: 150px;
    background: var(--orange); color: #fff; border: 0; border-radius: 12px;
    padding: 15px 22px; font-size: 16px; font-weight: 900; letter-spacing: .5px;
    box-shadow: 0 6px 0 #a8560f, 0 8px 16px rgba(0,0,0,.35);
    transition: transform .06s, box-shadow .06s;
  }
  .ci-buy:hover { background: var(--orange-deep); }
  .ci-buy:active { transform: translateY(4px); box-shadow: 0 2px 0 #a8560f, 0 4px 8px rgba(0,0,0,.35); }
  .ci-buy[disabled] { background: #3a4666; color: #8794b3; box-shadow: none; cursor: not-allowed; }

  /* ── 구매 확인 / 성공 / 실패 서브뷰 (모달 내부 오버레이) ── */
  .confirm {
    position: absolute; inset: 0; z-index: 5; display: none;
    background: rgba(9,15,32,.86); backdrop-filter: blur(3px);
    align-items: center; justify-content: center; padding: 20px;
  }
  .confirm.open { display: flex; }
  .confirm-box {
    width: 100%; max-width: 420px; border-radius: 14px; overflow: hidden;
    background: linear-gradient(180deg,#20325c,#132446); border: 2px solid var(--ci-frame);
    box-shadow: 0 0 0 1px var(--ci-frame-hi) inset; text-align: center; padding: 24px 22px;
  }
  .confirm-box .icon { width: 54px; height: 54px; border-radius: 50%; margin: 0 auto 12px; display: grid; place-items: center; font-size: 28px; }
  .confirm-box .icon.q { background: rgba(239,138,44,.18); color: var(--orange); border: 2px solid var(--orange); }
  .confirm-box .icon.ok { background: rgba(22,163,74,.18); color: #4ade80; border: 2px solid #22c55e; }
  .confirm-box .icon.err { background: rgba(225,29,72,.18); color: #fb7185; border: 2px solid #f43f5e; }
  .confirm-box h4 { margin: 0 0 6px; font-size: 17px; font-weight: 800; color: #fff; }
  .confirm-box p { margin: 0 0 4px; font-size: 13px; color: #b9c6e6; line-height: 1.55; }

      skill1Name:'마나 회복 8% 증가', skill2Name:null, skillPercent:0,
      goldforceExpireAt:null, price:320000, sellerNickname:'초보상점', status:'ACTIVE' },
    { img:'axe_earth_8', rank:'S', subGroup:1, kind:1, element:3, level:8, frame:'골드',
      nameSnapshot:'분쇄의 대형도끼', specSnapshot:'양손 대형 무기',
      skill1Name:'치명타 30% 증가', skill2Name:'분쇄 4초', skillPercent:13,
      goldforceExpireAt:'2026-08-11T00:00:00Z', price:5600000, sellerNickname:'광부길드', status:'ACTIVE' },
    { img:'armor_wind_4', rank:'B', subGroup:2, kind:3, element:4, level:4, frame:'블랙',
      nameSnapshot:'바람의 경갑', specSnapshot:'경량 갑옷 · 회피 보정',
      skill1Name:'회피율 18% 증가', skill2Name:'질주 3초', skillPercent:8,
      goldforceExpireAt:null, price:980000, sellerNickname:'유랑상인', status:'ACTIVE' },
  ];

  const compact = (n) => n >= 100000000 ? (n/100000000).toFixed(1).replace(/\.0$/,'')+'억'
                     : n >= 10000 ? Math.floor(n/10000)+'만' : NF.format(n);
  const typeLine = (it) => `${it.frame} - ${SUBG[it.subGroup]}`;
  const kindLabel = (it) => (KIND[it.subGroup]||{})[it.kind] || '종류';
  const gfDays = (iso) => {
    if (!iso) return 0;
    const d = Math.ceil((new Date(iso) - Date.now()) / 86400000);
    return d > 0 ? d : 0;
  };

  document.getElementById('walletBalance').textContent = NF.format(BALANCE) + ' GM';
  document.getElementById('walletChip').textContent = NF.format(BALANCE) + ' GM';
  // 모달 썸네일은 openModal() 이 열 때마다 교체하나, 정적 상태에서도 깨진 이미지가 없도록 초기 채움.
  document.getElementById('ciImg').src = CARD_IMAGES[LISTINGS[0].img];

  /* ── 그리드 렌더 ── */
  const grid = document.getElementById('grid');
  LISTINGS.forEach((it, i) => {
    const el = EL[it.element];
    const card = document.createElement('div');
    card.className = 'card';
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', it.nameSnapshot + ' 카드정보 보기');
    card.innerHTML = `
      <div class="card__art">
        <span class="rank ${it.rank}">${it.rank}</span>
        <img src="${CARD_IMAGES[it.img]}" alt="" />
        <span class="lvl">Lv.${it.level}</span>
        <button class="card__buy" data-i="${i}" aria-label="${it.nameSnapshot} 바로 구매">바로 구매</button>
      </div>
      <div class="card__body">
        <span class="card__type">${typeLine(it)} <span class="ebadge e-${el.cls}">${el.ko}</span></span>
        <span class="card__sub">${kindLabel(it)} · Lv.${it.level}</span>
        <span class="card__skill">${it.skill1Name || ''}</span>
        <span class="card__price">${NF.format(it.price)}<span class="u"> GM</span></span>
      </div>`;
    card.addEventListener('click', () => openModal(i));
    card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(i); } });
    card.querySelector('.card__buy').addEventListener('click', (e) => { e.stopPropagation(); openModal(i); });
    grid.appendChild(card);
  });

  /* ── 모달 상태 ── */
  let current = null;
  const overlay = document.getElementById('overlay');

  const SKILLS = {
    basic: (it) => `<h3>기본 특징</h3>
      <div class="kv-grid">
        <div><span class="k">분류</span><span class="v">${SUBG[it.subGroup]} · ${kindLabel(it)}</span></div>
        <div><span class="k">프레임</span><span class="v">${it.frame}</span></div>
        <div><span class="k">속성</span><span class="v">${EL[it.element].ko}</span></div>
        <div><span class="k">레벨</span><span class="v">Lv.${it.level}</span></div>
      </div>
      <p class="muted-note" style="margin-top:10px">${it.specSnapshot}</p>`,
    stat: (it) => `<h3>능력 수치</h3>
      <div class="kv-grid">
        <div><span class="k">강화 레벨</span><span class="v">${it.level} / 9</span></div>
        <div><span class="k">랭크</span><span class="v">${it.rank}</span></div>
        <div><span class="k">주 효과</span><span class="v">${it.skill1Name}</span></div>
        <div><span class="k">골드포스</span><span class="v">${gfDays(it.goldforceExpireAt) > 0 ? gfDays(it.goldforceExpireAt)+'일 남음' : '없음'}</span></div>
      </div>`,
    skill: (it) => {
      const rows = [];
      if (it.skill1Name) rows.push(`<li><span class="n">1</span><span>${it.skill1Name}</span></li>`);
      if (it.skill2Name) rows.push(`<li><span class="n">2</span><span>${it.skill2Name}${it.skillPercent ? ` <span class="pct">(${it.skillPercent}%)</span>` : ''}</span></li>`);
      return `<h3>특수 스킬</h3><ul class="skill-list">${rows.join('') || '<li class="muted-note">보유한 특수 스킬이 없습니다.</li>'}</ul>`;
    },
    fusion: () => `<h3>합성 조건</h3>
      <p class="muted-note">동일 종류 · 동일 속성 카드 2장 이상 필요. 합성 시 레벨 상승 확률이 적용되며
      실패 시 재료 카드가 소멸할 수 있습니다. (마켓 구매와는 무관한 게임 내 기능 안내)</p>`,
  };

  let activeTab = 'skill';

  function renderTab() {
    document.querySelectorAll('.ci-tab').forEach(t => t.classList.toggle('on', t.dataset.tab === activeTab));
    document.getElementById('ciPanel').innerHTML = SKILLS[activeTab](current);
  }
  document.getElementById('ciTabs').addEventListener('click', (e) => {
    const b = e.target.closest('.ci-tab'); if (!b) return;
    activeTab = b.dataset.tab; renderTab();
  });

  function openModal(i) {
    current = LISTINGS[i];
    activeTab = 'skill';
    const it = current, el = EL[it.element], gd = gfDays(it.goldforceExpireAt);

    document.getElementById('ciImg').src = CARD_IMAGES[it.img];
    const rk = document.getElementById('ciRank'); rk.className = 'rank ' + it.rank; rk.textContent = it.rank;
    document.getElementById('ciLvl').textContent = 'Lv.' + it.level;

    document.getElementById('ciAttrs').innerHTML = `
      <div class="ci-row"><span class="k">타입</span><span class="v">${typeLine(it)}</span></div>
      <div class="ci-row"><span class="k">명칭</span><span class="v">${it.nameSnapshot}</span></div>
      <div class="ci-row"><span class="k">종류 · 레벨</span><span class="v">${kindLabel(it)} · Lv.${it.level}</span></div>
      <div class="ci-row"><span class="k">속성</span><span class="v el-${el.cls}">${el.ko}</span></div>
      <div class="ci-row"><span class="k">남은 골드 포스</span><span class="v ${gd>0?'':'gf-off'}">${gd>0 ? gd+'일' : '0'}</span></div>`;

    document.getElementById('ciSpec').textContent = it.specSnapshot;
    document.getElementById('ciPrice').textContent = NF.format(it.price) + ' ';
    document.getElementById('ciSeller').textContent = '판매자 ' + it.sellerNickname;

    const buy = document.getElementById('ciBuy');
    buy.disabled = false; buy.textContent = '바로 구매';

    renderTab();
    document.getElementById('confirm').classList.remove('open');
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    overlay.classList.remove('open');
    document.getElementById('confirm').classList.remove('open');
    document.body.style.overflow = '';
  }
  overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

  /* ── 구매 확인 → 성공/실패 ── */
  const confirm = document.getElementById('confirm');
  const box = document.getElementById('confirmBox');

  function openConfirm() {
    const it = current;
    const rest = BALANCE - it.price;
    const low = rest < 0;
    box.innerHTML = `
      <div class="icon q">?</div>
      <h4>${it.nameSnapshot}</h4>
      <p>아래 금액으로 즉시 구매됩니다. 게임머니가 바로 차감되고<br>아이템은 인벤토리로 들어옵니다.</p>
      <div class="confirm-price"><span class="k">판매가</span><span class="v">${NF.format(it.price)} GM</span></div>
      <div class="confirm-price"><span class="k">구매 후 잔액</span><span class="v ${low?'low':''}">${NF.format(rest)} GM</span></div>
      <div class="confirm-actions">
        <button class="btn-ghost" onclick="backToInfo()">취소</button>
        <button class="btn-primary" onclick="doPurchase()">구매 확정</button>
      </div>`;
    confirm.classList.add('open');
  }

  function backToInfo() { confirm.classList.remove('open'); }

  function doPurchase() {
    const it = current;
    // 클라 표시 판정일 뿐, 최종 판정은 서버(SHOP_005 등). 목업은 잔액 비교로 분기 시연.
    if (BALANCE - it.price < 0) {
      box.innerHTML = `
        <div class="icon err">!</div>
        <h4>구매 실패</h4>
        <p>보유 게임머니가 부족합니다. 충전 후 다시 시도해 주세요.</p>
        <div class="confirm-price"><span class="k">부족 금액</span><span class="v low">${NF.format(it.price - BALANCE)} GM</span></div>
        <span class="err-code">SHOP_005 · 422 Unprocessable</span>
        <div class="confirm-actions">
          <button class="btn-ghost" onclick="backToInfo()">돌아가기</button>
          <button class="btn-primary" onclick="alert('데모: 지갑 충전 화면으로 이동')">게임머니 충전</button>
        </div>`;
    } else {
      box.innerHTML = `
        <div class="icon ok">✓</div>
        <h4>구매 완료</h4>
        <p><b>${it.nameSnapshot}</b> 을(를) 구매했습니다.<br>아이템은 인벤토리에서 확인하세요.</p>
        <div class="confirm-price"><span class="k">결제 금액</span><span class="v">${NF.format(it.price)} GM</span></div>
        <div class="confirm-actions">
          <button class="btn-primary" onclick="closeModal()">확인</button>
        </div>`;
    }
  }

  /* ── 스크린샷 캡처용 딥링크(목업 전용): ?open=N&step=confirm|success|fail ──
     헤드리스 캡처가 로드 시 특정 상태를 렌더하도록 돕는다. 실제 화면 동선과 무관. */
  (function () {
    const q = new URLSearchParams(location.search);
    if (!q.has('open')) return;
    const i = Math.max(0, Math.min(LISTINGS.length - 1, parseInt(q.get('open'), 10) || 0));
    openModal(i);
    const step = q.get('step');
    if (step === 'confirm') openConfirm();
    else if (step === 'success' || step === 'fail') { openConfirm(); doPurchase(); }
  })();
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FinalCall 승인 효과 월드맵 목업</title>
  <style>
    :root{--ink:#18181b;--muted:#52525b;--line:#e4e4e7;--purple:#6e2a9f}*{box-sizing:border-box}body{margin:0;min-width:320px;background:#cfe7f6;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.scene{position:fixed;inset:0;overflow:hidden;background:url('assets/common-background-variants/world-map-water-region-v2.png') center/cover no-repeat}.scene::after{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 52%,rgba(255,255,255,.08),transparent 57%);content:"";pointer-events:none}.scene canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.shell{position:relative;z-index:2;min-height:100vh;padding:24px}.toolbar{position:sticky;top:16px;z-index:3;display:flex;align-items:center;gap:10px;width:min(100%,1050px);margin:0 auto 24px;border:1px solid rgba(255,255,255,.82);border-radius:8px;background:rgba(24,24,27,.88);padding:10px 12px;color:#fff;box-shadow:0 8px 24px rgba(24,24,27,.16)}.toolbar strong{font-size:13px}.legend{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}.legend span{border:1px solid rgba(255,255,255,.25);border-radius:5px;padding:5px 8px;font-size:11px}.toggle{min-height:34px;border:1px solid #fff;border-radius:5px;background:#fff;padding:0 12px;color:var(--ink);font-weight:750;cursor:pointer}.content{width:min(100%,1050px);min-height:660px;margin:auto;border:1px solid var(--line);border-radius:12px;background:#fff;padding:34px;box-shadow:0 18px 50px rgba(24,24,27,.15)}.kicker{margin:0;color:var(--purple);font-size:13px;font-weight:800}.content h1{margin:8px 0 10px;font-size:28px;letter-spacing:-.025em}.content>p{max-width:64ch;margin:0;color:var(--muted);line-height:1.65}.grid{display:grid;grid-template-columns:1.4fr .7fr;gap:20px;margin-top:28px}.block{min-height:230px;border:1px solid var(--line);border-radius:8px;background:#fafafa;padding:20px}.block:first-child{min-height:390px}.block h2{margin:0 0 14px;font-size:17px}.line{height:12px;margin:11px 0;border-radius:3px;background:#e4e4e7}.line:nth-child(2){width:72%}.line:nth-child(3){width:88%}.line:nth-child(4){width:58%}@media(max-width:760px){.shell{padding:12px}.toolbar{top:8px;align-items:flex-start;flex-direction:column}.legend{margin-left:0}.content{padding:20px}.grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce),(update:slow){canvas{display:none}}
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true"><canvas id="effects"></canvas></div>
  <main class="shell">
    <div class="toolbar"><strong>기존 승인 효과 이식</strong><div class="legend"><span>좌상단 흙 · 고대수호</span><span>좌하단 바람 · 나선돌풍</span><span>우상단 불 · 용암맥동</span><span>우하단 물 · 자연 낙수</span></div><button class="toggle" type="button" aria-pressed="true">효과 끄기</button></div>
    <section class="content"><p class="kicker">WORLD MAP APPROVED EFFECTS</p><h1>콘텐츠 영역 밖에서만 움직이는 월드 효과</h1><p>기존 몰입형 경매 목업의 확정 효과를 영역 좌표에 맞게 이식했습니다. 새 물 권역은 산호 군도, 수로, 폭포와 수중 던전 입구로 구분됩니다.</p><div class="grid"><div class="block"><h2>목록 및 상세 콘텐츠</h2><div class="line"></div><div class="line"></div><div class="line"></div></div><aside class="block"><h2>거래 패널</h2><div class="line"></div><div class="line"></div></aside></div></section>
  </main>
  <script>
    const canvas=document.querySelector('#effects'),ctx=canvas.getContext('2d'),button=document.querySelector('.toggle');
    const reduced=matchMedia('(prefers-reduced-motion: reduce)'),slow=matchMedia('(update: slow)'),coarse=matchMedia('(pointer: coarse)');let width=0,height=0,dpr=1,raf=0,last=0,enabled=true,particles=[];
    const zones={earth:{x:.17,y:.18},wind:{x:.16,y:.70},fire:{x:.80,y:.18},water:{x:.80,y:.72}};
    function seed(){const count=coarse.matches?24:48,keys=Object.keys(zones);particles=Array.from({length:count},(_,i)=>{const key=keys[i%4],z=zones[key];return{key,x:z.x+((i*47%97)/97-.5)*.24,y:z.y+((i*73%101)/101-.5)*.2,size:1.4+(i%5)*.6,speed:.012+(i%7)*.004,drift:((i%5)-2)*.004,alpha:.24+(i%5)*.07,phase:i*.73}})}
    function resize(){dpr=Math.min(devicePixelRatio||1,1.5);width=canvas.clientWidth;height=canvas.clientHeight;canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
    function drawWind(p,t){const x=p.x*width,y=p.y*height,len=p.size*(12+(p.phase%4)*3),bend=Math.sin(t*.001+p.phase)*p.size*5,g=ctx.createLinearGradient(x-len,y,x+len*.3,y);g.addColorStop(0,'rgba(199,255,240,0)');g.addColorStop(.45,'rgba(220,255,247,.5)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.strokeStyle=g;ctx.lineWidth=.8+(p.phase%3)*.65;ctx.beginPath();ctx.moveTo(x-len,y+bend);ctx.bezierCurveTo(x-len*.42,y-bend,x+len*.12,y+bend*.45,x+len*.35,y);ctx.stroke()}
    function drawFire(p,t){const x=p.x*width,y=p.y*height,s=p.size*(3.3+Math.sin(t*.004+p.phase)*.45),g=ctx.createRadialGradient(x,y,0,x,y,s);g.addColorStop(0,'rgba(255,245,168,.86)');g.addColorStop(.35,'rgba(255,154,50,.68)');g.addColorStop(1,'rgba(255,70,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,s,0,Math.PI*2);ctx.fill()}
    function drawEarth(p,t){const x=p.x*width,y=p.y*height,s=p.size*4,g=ctx.createRadialGradient(x,y,0,x,y,s);g.addColorStop(0,'rgba(215,249,255,.78)');g.addColorStop(.3,'rgba(61,188,226,.48)');g.addColorStop(1,'rgba(33,122,151,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,s,0,Math.PI*2);ctx.fill();if(p.phase%4>3){ctx.save();ctx.translate(x,y);ctx.rotate(t*.0002+p.phase);ctx.strokeStyle='rgba(222,190,102,.42)';ctx.beginPath();ctx.rect(-s,-s,s*2,s*2);ctx.stroke();ctx.restore()}}
    function drawWater(p){const x=p.x*width,impact=(.66+(p.phase%4)*.035)*height,y=p.y*height,ds=2+(p.phase%3)*.75,d=impact-y;ctx.globalAlpha=.4+(p.phase%4)*.06;if(d>0){const g=ctx.createRadialGradient(x-ds*.35,y-ds*.45,0,x,y,ds*1.45);g.addColorStop(0,'rgba(255,255,255,.86)');g.addColorStop(.22,'rgba(199,241,250,.68)');g.addColorStop(.7,'rgba(62,157,191,.5)');g.addColorStop(1,'rgba(14,96,137,.08)');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y,ds,ds*1.16,p.drift*6,0,Math.PI*2);ctx.fill()}else if(d>-height*.055){const q=Math.abs(d)/(height*.055),fade=1-q;ctx.strokeStyle=`rgba(207,247,252,${.38*fade})`;ctx.lineWidth=.75+fade*.35;ctx.beginPath();ctx.ellipse(x+p.drift*90,impact,ds*(1.8+q*6.8),ds*(.42+q*1.15),p.drift*3,0,Math.PI*2);ctx.stroke();if(q<.42&&p.phase%4>2.4){ctx.fillStyle=`rgba(225,250,253,${.44*(1-q/.42)})`;ctx.beginPath();ctx.ellipse(x+ds*1.3,impact-ds*Math.sin(q/.42*Math.PI)*2.2,ds*.28,ds*.38,.35,0,Math.PI*2);ctx.fill()}}ctx.globalAlpha=1}
    function draw(t=0){const dt=Math.min((t-last)/1000||0,.04);last=t;ctx.clearRect(0,0,width,height);for(const p of particles){ctx.globalAlpha=p.alpha;if(p.key==='wind'){const z=zones.wind,dx=p.x-z.x,dy=p.y-z.y,force=p.speed*dt*.72;p.x+=-dy*force;p.y+=dx*force;drawWind(p,t)}else if(p.key==='fire'){p.y-=p.speed*dt*.9;p.x+=Math.sin(t*.0015+p.phase)*dt*.006;drawFire(p,t)}else if(p.key==='earth'){p.x+=p.drift*dt;p.y+=Math.sin(t*.0007+p.phase)*dt*.009;drawEarth(p,t)}else{p.y+=p.speed*dt*(1.65+Math.max(0,p.y)*1.35);drawWater(p)}const z=zones[p.key];if(Math.abs(p.x-z.x)>.16)p.x=z.x-.12;if(p.y<z.y-.15)p.y=z.y+.12;if(p.y>z.y+.16)p.y=z.y-.14}ctx.globalAlpha=1;if(enabled&&!document.hidden&&!reduced.matches&&!slow.matches)raf=requestAnimationFrame(draw)}
    function restart(){cancelAnimationFrame(raf);ctx.clearRect(0,0,width,height);if(enabled&&!document.hidden&&!reduced.matches&&!slow.matches){last=0;raf=requestAnimationFrame(draw)}}button.addEventListener('click',()=>{enabled=!enabled;button.setAttribute('aria-pressed',String(enabled));button.textContent=enabled?'효과 끄기':'효과 켜기';restart()});let timer;addEventListener('resize',()=>{clearTimeout(timer);timer=setTimeout(()=>{resize();restart()},120)},{passive:true});document.addEventListener('visibilitychange',restart);[reduced,slow,coarse].forEach(m=>m.addEventListener('change',()=>{seed();restart()}));resize();seed();restart();
  </script>
</body>
</html>

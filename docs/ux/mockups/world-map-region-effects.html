<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FinalCall 월드맵 영역 효과 목업</title>
  <style>
    :root{--ink:#18181b;--muted:#52525b;--line:#e4e4e7;--surface:#fff;--purple:#6e2a9f;--focus:#6e2a9f}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink)}button{font:inherit}
    body{overflow-x:hidden;background:#dcecff}.world{position:fixed;inset:0;overflow:hidden;background:url('assets/common-background-variants/world-map-v1.png') center/cover no-repeat}
    .world::after{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 53%,rgba(255,255,255,.10) 0 24%,transparent 58%);content:"";pointer-events:none}
    canvas,.energy{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.energy{mix-blend-mode:screen}
    .zone{position:absolute;border-radius:50%;opacity:0;filter:blur(1px);transition:opacity .24s ease-out}.earth{left:-5%;top:-9%;width:43%;height:54%;background:radial-gradient(ellipse,rgba(222,188,96,.22),transparent 64%)}.wind{left:-8%;bottom:-15%;width:50%;height:61%;background:radial-gradient(ellipse,rgba(102,204,204,.25),transparent 62%)}.fire{right:-8%;top:-7%;width:47%;height:49%;background:radial-gradient(ellipse,rgba(255,85,0,.22),transparent 63%)}.water{right:-9%;bottom:-15%;width:47%;height:58%;background:radial-gradient(ellipse,rgba(25,178,255,.28),transparent 62%)}
    body[data-mode="landmark"] .zone,body[data-mode="event"] .zone,body[data-mode="dungeon"] .zone{opacity:1}body[data-mode="ambient"] .zone{opacity:.42}
    .shell{position:relative;z-index:3;min-height:100vh;padding:24px}.toolbar{position:sticky;top:20px;display:flex;align-items:center;gap:8px;width:max-content;max-width:100%;margin:0 auto 28px;padding:7px;border:1px solid rgba(255,255,255,.7);border-radius:10px;background:rgba(255,255,255,.94);box-shadow:0 8px 24px rgba(24,24,27,.14)}
    .toolbar strong{padding:0 10px;font-size:13px}.toolbar button{min-height:38px;border:1px solid transparent;border-radius:6px;background:transparent;padding:0 13px;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer}.toolbar button:hover{background:#f4f4f5}.toolbar button[aria-pressed="true"]{border-color:#c8a9dc;background:#f1eaf5;color:#5c2185}.toolbar button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
    .content{width:min(100%,1050px);min-height:660px;margin:auto;border:1px solid var(--line);border-radius:12px;background:#fff;padding:34px;box-shadow:0 16px 42px rgba(24,24,27,.14)}.eyebrow{margin:0;color:var(--purple);font-size:13px;font-weight:800}.content h1{margin:8px 0 10px;font-size:28px;letter-spacing:-.02em}.content p{max-width:64ch;margin:0;color:var(--muted);line-height:1.65}.placeholder{display:grid;grid-template-columns:1.4fr .7fr;gap:20px;margin-top:28px}.block{min-height:210px;border:1px solid var(--line);border-radius:8px;background:#fafafa;padding:20px}.block:first-child{min-height:360px}.block h2{margin:0 0 12px;font-size:17px}.line{height:12px;margin:11px 0;border-radius:3px;background:#e4e4e7}.line:nth-child(2){width:72%}.line:nth-child(3){width:88%}.line:nth-child(4){width:60%}.note{position:fixed;right:18px;bottom:18px;z-index:4;max-width:330px;border:1px solid rgba(255,255,255,.72);border-radius:8px;background:rgba(24,24,27,.88);padding:12px 14px;color:#fff;font-size:12px;line-height:1.55}.note b{color:#dfc447}
    @media(max-width:800px){.shell{padding:12px}.toolbar{top:8px;flex-wrap:wrap;justify-content:center;width:100%}.toolbar strong{width:100%;text-align:center}.content{padding:20px}.placeholder{grid-template-columns:1fr}.note{display:none}}
    @media(prefers-reduced-motion:reduce),(update:slow){canvas{display:none}.zone{transition:none!important;opacity:.25!important}}
  </style>
</head>
<body data-mode="ambient">
  <div class="world" aria-hidden="true">
    <div class="energy"><i class="zone earth"></i><i class="zone wind"></i><i class="zone fire"></i><i class="zone water"></i></div>
    <canvas id="effects"></canvas>
  </div>
  <main class="shell">
    <div class="toolbar" aria-label="영역 효과 목업 선택">
      <strong>효과 시안</strong>
      <button data-mode="ambient" aria-pressed="true">A · 잔잔한 생태</button>
      <button data-mode="landmark" aria-pressed="false">B · 랜드마크 마력</button>
      <button data-mode="event" aria-pressed="false">C · 월드 이벤트</button>
      <button data-mode="dungeon" aria-pressed="false">D · 던전 관문</button>
    </div>
    <section class="content">
      <p class="eyebrow">WORLD MAP EFFECT PREVIEW</p>
      <h1>흰색 콘텐츠 영역 가시성 확인</h1>
      <p>효과는 콘텐츠 위로 침범하지 않고 월드맵의 산악·숲·마을·성소 영역 안에서만 움직입니다.</p>
      <div class="placeholder"><div class="block"><h2>목록 및 상세 콘텐츠</h2><div class="line"></div><div class="line"></div><div class="line"></div></div><aside class="block"><h2>거래 패널</h2><div class="line"></div><div class="line"></div></aside></div>
    </section>
  </main>
  <div class="note"><b id="modeTitle">A · 잔잔한 생태</b><br><span id="modeCopy">흙먼지, 낙엽, 마을 불씨, 성소 잔물결을 낮은 밀도로 표현합니다.</span></div>
  <script>
    const canvas=document.querySelector('#effects'),ctx=canvas.getContext('2d');
    const reduced=matchMedia('(prefers-reduced-motion: reduce)'),slow=matchMedia('(update: slow)'),coarse=matchMedia('(pointer: coarse)');
    const descriptions={ambient:['A · 잔잔한 생태','흙먼지, 낙엽, 마을 불씨, 성소 잔물결을 낮은 밀도로 표현합니다.'],landmark:['B · 랜드마크 마력','산악 룬, 숲 바람길, 마을 봉화, 성소 수맥을 선명한 랜드마크 효과로 강조합니다.'],event:['C · 월드 이벤트','지진 파동, 나선 돌풍, 유성 불씨, 강한 수면 충돌을 주기적으로 발생시킵니다.'],dungeon:['D · 던전 관문','네 지역의 던전 입구에 회전 관문과 속성 궤적을 집중합니다.']};
    let mode='ambient',width=0,height=0,dpr=1,raf=0,last=0,particles=[];
    const zones={earth:{x:.18,y:.18,color:'205,172,86'},wind:{x:.17,y:.72,color:'102,204,204'},fire:{x:.78,y:.20,color:'255,85,0'},water:{x:.80,y:.73,color:'25,178,255'}};
    function seed(){const count=coarse.matches?24:48;particles=Array.from({length:count},(_,i)=>{const keys=['earth','wind','fire','water'],key=keys[i%4],z=zones[key];return{key,x:z.x+((i*37%100)/100-.5)*.22,y:z.y+((i*53%100)/100-.5)*.2,size:1.2+i%4*.55,speed:.08+i%5*.018,phase:i*.73,life:(i%11)/11}})}
    function resize(){dpr=Math.min(devicePixelRatio||1,1.5);width=canvas.clientWidth;height=canvas.clientHeight;canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
    function ring(x,y,r,color,alpha=.5){ctx.beginPath();ctx.ellipse(x,y,r,r*.38,0,0,Math.PI*2);ctx.strokeStyle=`rgba(${color},${alpha})`;ctx.lineWidth=1.2;ctx.stroke()}
    function draw(t=0){const dt=Math.min((t-last)/1000||0,.04);last=t;ctx.clearRect(0,0,width,height);const strength={ambient:.55,landmark:1,event:1.35,dungeon:1.1}[mode];for(const p of particles){const z=zones[p.key];p.life=(p.life+dt*p.speed*strength)%1;let x=p.x*width,y=p.y*height;if(p.key==='earth'){y+=(p.life-.5)*28;x+=Math.sin(p.phase+t*.00035)*8;ctx.fillStyle=`rgba(${z.color},${.15+.35*(1-p.life)})`;ctx.fillRect(x,y,p.size*1.6,p.size*.9);if(mode!=='ambient'&&p.life<.06)ring(z.x*width,z.y*height,22+p.life*500,z.color,.36)}else if(p.key==='wind'){const angle=p.phase+p.life*Math.PI*2*(mode==='event'?1.6:1);x=z.x*width+Math.cos(angle)*(30+p.life*90);y=z.y*height+Math.sin(angle)*(.35*(30+p.life*90));ctx.beginPath();ctx.moveTo(x-16,y+3);ctx.quadraticCurveTo(x,y-8,x+18,y);ctx.strokeStyle=`rgba(${z.color},${.2+.35*(1-p.life)})`;ctx.stroke()}else if(p.key==='fire'){y-=p.life*(mode==='event'?120:70);x+=Math.sin(p.phase+t*.002)*10;const g=ctx.createRadialGradient(x,y,0,x,y,p.size*5);g.addColorStop(0,`rgba(255,218,120,${.65*(1-p.life)})`);g.addColorStop(1,'rgba(255,85,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,p.size*5,0,Math.PI*2);ctx.fill()}else{y+=p.life*(mode==='event'?105:68);ctx.beginPath();ctx.moveTo(x,y-p.size*5);ctx.lineTo(x,y);ctx.strokeStyle=`rgba(${z.color},${.24+.36*(1-p.life)})`;ctx.stroke();if(p.life>.82)ring(x,z.y*height+55,p.size*(2+(p.life-.82)*28),z.color,.34)}if(mode==='dungeon'){const pulse=18+Math.sin(t*.002+p.phase)*6;ring(z.x*width,z.y*height,pulse,z.color,.17)}}if(!document.hidden&&!reduced.matches&&!slow.matches)raf=requestAnimationFrame(draw)}
    function restart(){cancelAnimationFrame(raf);ctx.clearRect(0,0,width,height);if(!document.hidden&&!reduced.matches&&!slow.matches){last=0;raf=requestAnimationFrame(draw)}}
    document.querySelectorAll('.toolbar [data-mode]').forEach(button=>button.addEventListener('click',()=>{mode=button.dataset.mode;document.body.dataset.mode=mode;document.querySelectorAll('.toolbar [data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===button)));document.querySelector('#modeTitle').textContent=descriptions[mode][0];document.querySelector('#modeCopy').textContent=descriptions[mode][1];seed();restart()}));
    let timer;addEventListener('resize',()=>{clearTimeout(timer);timer=setTimeout(()=>{resize();restart()},120)},{passive:true});document.addEventListener('visibilitychange',restart);[reduced,slow,coarse].forEach(m=>m.addEventListener('change',()=>{seed();restart()}));resize();seed();restart();
  </script>
</body>
</html>

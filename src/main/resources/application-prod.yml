# prod 프로파일: 시크릿/환경종속 값은 기본값 없이 주입 → 누락 시 부팅 실패(fail-fast). 하드코딩 금지.
#
# app.name / app.description 는 어떤 기본값도 두지 않는다.
# 환경변수 APP_NAME / APP_DESCRIPTION 으로 주입한다(relaxed binding → app.name / app.description).
# 누락 시 @NotBlank 검증 실패로 부팅이 중단된다(fail-fast).
# (주의: app.name: ${APP_NAME} 처럼 placeholder 를 쓰면 @ConfigurationProperties 바인더가
#  미해결 placeholder 를 리터럴로 남겨 @NotBlank 를 통과시켜 fail-fast 가 무력화된다.
#  따라서 검증 대상 문자열은 placeholder 대신 relaxed binding 으로 주입한다.)

# Stage 5: prod 는 management 엔드포인트를 앱 포트와 분리한다.
# Stage 4: prod 는 트레이스 샘플링을 낮춘다(TRACE_SAMPLING_PROD=0.1).
management:
  server:
    # ★ 이 management 포트는 반드시 내부망에서만 접근 가능하도록 인프라(방화벽/보안그룹/NetworkPolicy)에서
    #   차단해야 한다. 외부 노출 시 메트릭·헬스 상세가 유출된다.
    port: 8081
  tracing:
    sampling:
      probability: 0.1

# Stage D: DataSource — prod 는 반드시 기본값 없이 ${ENV} 만 사용(fail-fast).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  # Stage E1: Redis — prod 는 반드시 기본값 없이 ${ENV}.
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

# local 프로파일: 모든 값에 기본값을 두어 환경변수 없이 즉시 실행된다.
# 시크릿/환경종속 값은 ${ENV:기본값} 형태 — 환경변수가 있으면 그 값, 없으면 기본값 사용.

app:
  name: ${APP_NAME:finalcall}
  description: ${APP_DESCRIPTION:게임 아이템 경매 플랫폼}

# --- 다음 단계용 자리(형태만, 실제 연결 없음) ---

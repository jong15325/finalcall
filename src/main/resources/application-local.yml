# local 프로파일: 모든 값에 기본값을 두어 환경변수 없이 즉시 실행된다.
# 시크릿/환경종속 값은 ${ENV:기본값} 형태 — 환경변수가 있으면 그 값, 없으면 기본값 사용.

app:
  name: ${APP_NAME:finalcall}
  description: ${APP_DESCRIPTION:게임 아이템 경매 플랫폼}

# Stage D: DataSource — local 은 ${ENV:기본값} 으로 환경변수 없이도 뜬다.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/finalcall}
    username: ${DB_USERNAME:finalcall}
    password: ${DB_PASSWORD:finalcall}
    hikari:
      # ★ 아래는 튜닝 대상 — 구체 수치는 DB 최대 커넥션·CPU·동시성 고려해 추후 설정(무작정 크게 금지).
      #   미설정 시 HikariCP 기본값 사용.
      # maximum-pool-size:   # 최대 커넥션 수(DB max_connections/CPU/동시성 고려)
      # minimum-idle:        # 최소 유휴 커넥션
      # connection-timeout:  # 커넥션 획득 대기(ms)
      # max-lifetime:        # 커넥션 최대 수명(ms), DB wait_timeout 보다 짧게

# Stage E1: Redis(Lettuce) — local 은 ${ENV:기본값}. Redisson 도 같은 host/port 를 바라본다(설정은 각각).
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

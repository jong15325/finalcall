# dev 프로파일: 시크릿/환경종속 값은 기본값 없이 주입 → 누락 시 부팅 실패(fail-fast). 하드코딩 금지.
#
# gateway.internal.secret 은 여기 두지 않는다.
# 환경변수 GATEWAY_INTERNAL_SECRET 로 주입한다(relaxed binding → gateway.internal.secret).
# 기본값이 없으므로 누락 시 @NotBlank 검증 실패로 부팅이 중단된다.
# (주의: gateway.internal.secret: ${GATEWAY_INTERNAL_SECRET} 처럼 placeholder 를 쓰면 미해결 시
#  리터럴로 남아 @NotBlank 를 통과시켜 fail-fast 가 무력화된다. 쓰지 않는다.)

# 하류 서비스 주소 — dev 는 기본값 없이 ${ENV}(미해결 placeholder 는 부팅 시 실패).
service:
  uri: ${SERVICE_URI}

spring:
  # RequestRateLimiter 용 Redis — dev 는 기본값 없이 ${ENV}.
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

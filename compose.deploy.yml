name: finalcall-deploy

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-finalcall}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=full
      - --server-id=1
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --binlog-expire-logs-seconds=1209600
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [finalcall-app-network]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks: [finalcall-app-network]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    build:
      context: ./backend/docker/search/elasticsearch
    image: finalcall-elasticsearch-nori:8.18.8
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks: [finalcall-app-network]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [finalcall-app-network]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    command: server /data --console-address :9001
    volumes:
      - minio-data:/data
    networks: [finalcall-app-network]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: backend
    image: finalcall-backend:local
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      APP_NAME: finalcall
      APP_DESCRIPTION: ${APP_DESCRIPTION:-게임 아이템 경매 플랫폼}
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-finalcall}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BOARD_IMAGE_ENDPOINT: http://minio:9000
      BOARD_IMAGE_REGION: us-east-1
      BOARD_IMAGE_BUCKET: finalcall-board-images
      BOARD_IMAGE_PATH_STYLE: "true"
      BOARD_IMAGE_ENSURE_BUCKET: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:?GATEWAY_INTERNAL_SECRET is required}
      GATEWAY_INTERNAL_ENFORCED: "true"
      CHAT_ALLOWED_ORIGINS: https://jjh-finalcall.info
      CHAT_KAFKA_TOPIC_REPLICATION_FACTOR: 1
      CHAT_KAFKA_TOPIC_MIN_ISR: 1
      OAUTH_NAVER_REDIRECT_URI: https://jjh-finalcall.info/oauth/callback
      OAUTH_KAKAO_REDIRECT_URI: https://jjh-finalcall.info/oauth/callback
      OAUTH_NAVER_CLIENT_ID: ${OAUTH_NAVER_CLIENT_ID:?OAUTH_NAVER_CLIENT_ID is required}
      OAUTH_NAVER_CLIENT_SECRET: ${OAUTH_NAVER_CLIENT_SECRET:?OAUTH_NAVER_CLIENT_SECRET is required}
      OAUTH_KAKAO_CLIENT_ID: ${OAUTH_KAKAO_CLIENT_ID:?OAUTH_KAKAO_CLIENT_ID is required}
      OAUTH_KAKAO_CLIENT_SECRET: ${OAUTH_KAKAO_CLIENT_SECRET:?OAUTH_KAKAO_CLIENT_SECRET is required}
      MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME is required}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD is required}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [finalcall-app-network]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: gateway
    image: finalcall-gateway:local
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      GATEWAY_PORT: 8080
      SERVICE_URI: http://backend:8080
      SERVICE_WS_URI: ws://backend:8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:?GATEWAY_INTERNAL_SECRET is required}
      # cloudflared가 만든 client XFF + nginx hop을 신뢰하고 그보다 왼쪽 값은 배제한다.
      GATEWAY_TRUSTED_PROXY_COUNT: 2
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      finalcall-app-network:
      finalcall-proxy-network:
        aliases:
          - finalcall-gateway
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: finalcall-frontend:local
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      finalcall-proxy-network:
      public-edge:
        aliases:
          - finalcall-frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10

networks:
  finalcall-app-network:
    name: finalcall-app-network
  finalcall-proxy-network:
    name: finalcall-proxy-network
  public-edge:
    external: true
    name: public-edge

volumes:
  mysql-data:
  redis-data:
  elasticsearch-data:
  kafka-data:
  minio-data:

# 프로파일 무관 공통 설정.
# 활성 프로파일은 yml 에 하드코딩하지 않는다(spring.profiles.active 금지).
# 활성 프로파일 미지정 시 local 로 동작하도록 default 만 지정하고,
# 실제 활성화는 SPRING_PROFILES_ACTIVE 환경변수로만 한다(예: dev/prod 배포 시).
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: finalcall
  profiles:
    default: local
  jackson:
    serialization:
      # Instant 등 시간 타입을 epoch 숫자가 아닌 ISO-8601 문자열로 직렬화(TIMESTAMP_FORMAT=ISO-8601).
      write-dates-as-timestamps: false
  # EPIC-BOARD(FC-200): 게시글 이미지 업로드(multipart). 프레임워크 상한을 넉넉히 두고(10MB) 실제 5MB 제한은
  #   서비스가 검증해 IMAGE_002(422)로 통일한다 — 프레임워크 MaxUploadSizeExceededException 이 아니라 계약 에러코드로
  #   응답하기 위함(api §6.4). 기본값(1MB)이면 5MB 이미지가 프레임워크 단계에서 잘려 계약 에러코드가 나오지 않는다.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # Stage D: JPA — 전 프로파일 validate(스키마는 Flyway 관리). DataSource 는 프로파일별로 주입.
  jpa:
    hibernate:
      ddl-auto: validate         # create/update 금지. Flyway 가 만든 스키마를 검증만 한다.
    open-in-view: false          # OSIV 는 커넥션을 뷰 렌더링까지 붙들어 커넥션 고갈 위험 → 끔.
    # show-sql 금지. SQL 로깅은 logger 레벨(org.hibernate.SQL)로 제어한다.
  # Stage D: Flyway — 전 프로파일 활성화. 부팅 순서: Flyway 스키마 생성 → JPA validate 검증.
  flyway:
    enabled: true
    locations: classpath:db/migration
  # EPIC-SEARCH(FC-107): Elasticsearch(검색 read-model) 접속. Java API client autoconfig(co.elastic.clients).
  #   ES 는 파생 read-model 이라 부팅 시 연결하지 않고(빈만 생성), 질의 시 연결한다 — ES 미기동에도 앱은 뜬다.
  #   uris 는 로컬 기본값(${ENV:기본값}), 배포는 매니지드 ES 엔드포인트를 환경변수로 주입한다.
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    connection-timeout: 2s
    socket-timeout: 5s
  # EPIC-CHAT(FC-321): 수동 ack는 Redis 재발행 성공 전에 consumer offset이 전진하지 않게 한다.
  #   record 단위 listener라 실패 record만 nack/replay하고 Kafka auto commit은 금지한다.
  kafka:
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        isolation.level: read_committed
        max.poll.records: 50
        allow.auto.create.topics: false
    listener:
      ack-mode: manual_immediate
  # EPIC-EMAIL-VERIFY(FC-130): 회원가입 이메일 인증 발송(JavaMailSender, 네이버 SMTP 465 SSL, spec §6.2).
  #   username/password 는 공통 yml 에 기본값을 두지 않는다 — 기본값을 두면 prod fail-fast 가 무력화된다(섹션 4).
  #   ★ 시크릿(비밀번호)은 커밋 금지 — 사용자가 env(MAIL_USERNAME/MAIL_PASSWORD)로만 주입한다(spec §6.2·섹션 2).
  #   로컬은 email.verify.sender-enabled=false 로 발송을 건너뛰어 크리덴셜 없이 부팅한다(application-local.yml).
  mail:
    host: ${MAIL_HOST:smtp.naver.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME}      # 기본값 없음 → dev/prod 미주입 시 fail-fast
    password: ${MAIL_PASSWORD}      # 시크릿 — 커밋 금지, env 주입
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true    # 465 = SSL(SMTPS)
      mail.smtp.starttls.enable: false

# Stage 4~5: Actuator 노출 + Prometheus 메트릭 + 분산추적(Micrometer Tracing).
management:
  endpoints:
    web:
      exposure:
        # 화이트리스트. '*'/exclude 금지. env/beans/heapdump/mappings/threaddump 절대 비노출.
        include: health, prometheus, info
  endpoint:
    health:
      # ★ show-details=always 는 management 포트가 내부망 격리됐다는 전제다.
      #   외부에 노출하는 구성이라면 반드시 never 로 바꿀 것.
      show-details: always
      # health group(liveness/readiness)은 배포 단계 관심사 — 자리만.
  info:
    env:
      enabled: true          # info.* 프로퍼티를 /actuator/info 로 노출
  metrics:
    tags:
      # 공통 태그. ★ 고카디널리티 금지: userId, path variable(/orders/{id}의 id), 요청 UUID 등
      #   고유값을 태그로 쓰지 말 것(시계열 카디널리티 폭발 → Prometheus 성능/저장 장애).
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        chat.message.persist.duration: true
        chat.room.lock.wait.duration: true
        chat.realtime.delivery.delay: true
      slo:
        chat.message.persist.duration: 200ms,500ms
        chat.room.lock.wait.duration: 100ms
        chat.realtime.delivery.delay: 500ms
  tracing:
    propagation:
      type: W3C            # 전파 포맷(W3C traceparent)
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}     # 기본(local/dev). prod 는 프로파일에서 0.1 로 오버라이드.
  # [INCLUDE_TRACE_EXPORT=false] span export 는 이번 단계 범위 밖. 로그 상관관계까지만.
  #   활성화 시: opentelemetry-exporter-otlp 추가 + management.otlp.tracing.endpoint 설정.

# EPIC-BID: 최소 입찰 증분 구간표(domain-spec §4 D-004, bid-domain-spec §3.3).
#   "신규입찰 >= 현재 최고가 + 해당 구간 증분". 첫 입찰은 증분 미적용(시작가 자체가 하한).
#   ★ 컴파일 상수가 아니라 운영 정책이라 설정으로 뺐다. 값이 비거나 step 이 0 이하면 부팅이 실패한다
#     (증분 0 은 최소 증분 검증을 무력화해 1원 단위 입찰 폭주를 허용한다 — 조용한 기본값 대체 금지).
#   프론트는 이 표를 복제하지 말고 상세 응답의 minNextBidAmount 를 쓴다(계약 v1.8 F3).
bid:
  increment:
    tiers:
      - threshold: 0
        step: 100
      - threshold: 10000
        step: 1000
      - threshold: 100000
        step: 5000
      - threshold: 1000000
        step: 10000
      - threshold: 10000000
        step: 100000
      - threshold: 100000000
        step: 1000000

# EPIC-EMAIL-VERIFY(FC-130): 이메일 인증 정책값(email-verify-spec §2.4·§3·§6.2). EmailVerifyProperties 로 바인딩.
#   ★ 컴파일 상수가 아니라 운영 정책이라 설정으로 뺐다. 0/음수면 @Positive 로 부팅이 실패한다(조용한 기본값 대체 금지).
#   sender-enabled 는 Properties 가 아니라 발송기 @ConditionalOnProperty 가 raw 키로 소비한다(발송 스킵 플래그).
#     로컬 기본 false(발송 스킵+코드 로그) — application-local.yml 에서 명시. dev/prod 는 true 전제(실발송·fail-fast).
email:
  verify:
    code-length: ${EMAIL_VERIFY_CODE_LENGTH:6}
    ttl-seconds: ${EMAIL_VERIFY_TTL_SECONDS:600}
    resend-cooldown-seconds: ${EMAIL_VERIFY_RESEND_COOLDOWN_SECONDS:60}
    max-attempts: ${EMAIL_VERIFY_MAX_ATTEMPTS:5}
    sender-enabled: ${MAIL_SENDER_ENABLED:false}

# Stage 5: /actuator/info 응답 내용(env 컨트리뷰터로 노출)
info:
  app:
    name: ${spring.application.name}
    description: 게임 아이템 경매 플랫폼 스켈레톤

# Stage E2: 회복탄력성(Resilience4j). 외부 의존성 호출을 CircuitBreaker + Retry 로 감싼다.
# 조합 순서(기본): Retry 가 CircuitBreaker 보다 바깥 → 재시도가 매번 CB 를 거치고, 최종 실패가 CB 통계에 반영.
#   (resilience4j.*.aspect-order 로 조정 가능하나 특별한 이유 없으면 기본을 따른다.)
resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 50                         # 실패율 50% 초과 시 회로 OPEN
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10                            # 최근 10건 기준 통계
        wait-duration-in-open-state: 10s                   # OPEN 유지 시간(이후 HALF_OPEN 전이)
        permitted-number-of-calls-in-half-open-state: 3    # HALF_OPEN 에서 시험 호출 수
        # 상태 전이: CLOSED →(실패율 초과)→ OPEN →(대기 경과)→ HALF_OPEN →(성공)→ CLOSED / (실패)→ OPEN
        # ★ record/ignore 규약: 외부 연동 실패/타임아웃은 record(통계 반영),
        #   4xx 성격 BusinessException 은 정상적 비즈니스 결과이므로 ignore(장애로 세지 않음).
        ignore-exceptions:
          - com.finalcall.common.exception.BusinessException
    instances:
      externalApi:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3                                    # 최초 1회 + 재시도 2회
        wait-duration: 500ms                               # 고정 간격(지수 백오프는 enable-exponential-backoff 로 옵션)
        # ★★ 멱등성 경고: Retry 는 멱등성이 보장된 호출에만. 결제/주문 생성처럼 부수효과 있는 호출을
        #   무작정 재시도하면 중복 처리(중복 결제 등)가 발생한다.
        # ★ retry/ignore 규약: 일시적 오류만 retry. 회로가 OPEN 이면 즉시 실패이므로 재시도 의미 없음 → ignore.
        ignore-exceptions:
          - com.finalcall.common.exception.BusinessException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
    instances:
      externalApi:
        base-config: default

# Stage F1: JWT 인증. secret 은 프로파일별 주입(local 기본값, dev/prod ${ENV} fail-fast).
jwt:
  algorithm: ${JWT_ALGORITHM:HS256}          # 시작(대칭키). 확장: RS256(공개키 검증)로 갈아끼울 수 있게 Provider 추상화.
  access-exp-minutes: ${JWT_ACCESS_EXP_MINUTES:30}
  refresh-exp-days: ${JWT_REFRESH_EXP_DAYS:14}      # refresh 만료(= Redis 저장분 TTL, B-011). 데모 기본값 — 정책에 맞게 조정.
  # secret 은 여기 두지 않는다(공통에 두면 prod fail-fast 무력화). application-<profile>.yml 참조.

# FC-154(EPIC-OAUTH): 소셜 로그인 provider 설정(OAuthProperties, 계약 §2 소셜 로그인).
#   token-uri·userinfo-uri 는 provider 표준 상수라 공통에 기본값을 둔다(시크릿 아님, 오버라이드 여지).
#   ★ client-id/secret·redirect-uri 는 여기 두지 않는다 — 공통에 두면 prod fail-fast(@NotBlank)가 무력화된다.
#     local 은 application-local.yml 의 ${OAUTH_*:더미} 로, dev/prod 는 env 주입(relaxed binding)으로만 채운다.
#   ★ client-secret 은 시크릿 — 커밋 금지, env(OAUTH_*_CLIENT_SECRET)로만 주입한다.
oauth:
  naver:
    token-uri: ${OAUTH_NAVER_TOKEN_URI:https://nid.naver.com/oauth2.0/token}
    userinfo-uri: ${OAUTH_NAVER_USERINFO_URI:https://openapi.naver.com/v1/nid/me}
  kakao:
    token-uri: ${OAUTH_KAKAO_TOKEN_URI:https://kauth.kakao.com/oauth/token}
    userinfo-uri: ${OAUTH_KAKAO_USERINFO_URI:https://kapi.kakao.com/v2/user/me}

# FC-009: 캐시→게임머니 교환 비율(1 캐시 = rate 게임머니). 비즈니스 기본값이며 시크릿이 아니라 공통에 둔다.
#   운영은 EXCHANGE_RATE 환경변수로 override 가능(ExchangeProperties @Positive 로 0/음수 부팅 차단).
exchange:
  rate: ${EXCHANGE_RATE:1000000}

# FC-082(EPIC-CLOSING): 플랫폼 중계 수수료 정책(fee-policy-spec v1.0). 판매자 단독 부담 구간별 누진(marginal).
#   ★ 컴파일 상수가 아니라 운영 정책이라 설정으로 뺐다(FeePolicyProperties @Validated 로 빈/음수 부팅 차단).
#   계산 순서(FeeCalculator): 구간 누진 → 원단위 사사오입 → cap(300,000) → 최소(100). up-to 미지정 구간 = 상한 없음.
#   version 은 sale_order·platform_revenue_ledger 에 스탬프되어 정산 후 환불 크레딧이 "당시 정책"을 재현한다.
fee:
  policy:
    version: v1.0
    min-fee: 100
    cap: 300000
    tiers:
      - up-to: 100000
        rate-percent: 6
      - up-to: 1000000
        rate-percent: 5
      - up-to: 3000000
        rate-percent: 4
      - rate-percent: 3      # up-to 미지정 = 3,000,001 ~ 상한 없음(최상위 구간)

# FC-082(EPIC-CLOSING): 마감 워커 폴링 파라미터(closing-domain-spec §3.1). 간격·배치는 운영 부하 트레이드오프.
#   enabled=true 운영 상시. 통합 테스트는 false 로 배경 tick 을 끄고 워커를 직접 호출해 결정적으로 검증한다.
closing:
  worker:
    enabled: ${CLOSING_WORKER_ENABLED:true}
    fixed-delay-ms: ${CLOSING_WORKER_FIXED_DELAY_MS:2000}
    batch-size: ${CLOSING_WORKER_BATCH_SIZE:200}

# FC-093(EPIC-SHOP): 고정가 마켓 설정.
#   listing.default-duration-days — 등록 시 서버가 end_at = now + 이 값(일)로 자동 계산(판매자 미선택, 게이트2 C5).
#     하드코딩 금지·향후 DB 이관 여지. 기본 7일.
#   expiry.worker — 기한 만료 자동 회수 워커(shop-spec §4.4). 만료는 경매 마감보다 시급성이 낮아 긴 주기(기본 60초).
#     enabled=true 운영 상시. 통합 테스트는 false 로 배경 tick 을 끄고 워커를 직접 호출해 결정적으로 검증한다.
shop:
  listing:
    default-duration-days: ${SHOP_LISTING_DEFAULT_DURATION_DAYS:7}
  expiry:
    worker:
      enabled: ${SHOP_EXPIRY_WORKER_ENABLED:true}
      fixed-delay-ms: ${SHOP_EXPIRY_WORKER_FIXED_DELAY_MS:60000}
      batch-size: ${SHOP_EXPIRY_WORKER_BATCH_SIZE:200}

# FC-188(EPIC-ITEM-DELIVERY): 배송 라이프사이클 워커(delivery-domain-spec §4·§5.4·§7.1). 웹이 소유하는 배송 쓰기측
#   배경 작업 — reconcile(APPLIED→IN_GAME 소유 이동) + reclaim(리스 만료 CLAIMED→PENDING 재청구)을 한 tick 에 묶는다.
#   enabled=true 운영 상시. 통합 테스트는 false 로 배경 tick 을 끄고 워커를 직접 호출해 결정적으로 검증한다.
#   배송은 마감보다 시급성이 낮아 긴 주기(기본 5초). lease-timeout-ms — 게임 청구(CLAIMED) 리스 유효 기간(기본 60초).
delivery:
  worker:
    enabled: ${DELIVERY_WORKER_ENABLED:true}
    fixed-delay-ms: ${DELIVERY_WORKER_FIXED_DELAY_MS:5000}
    batch-size: ${DELIVERY_WORKER_BATCH_SIZE:200}
    lease-timeout-ms: ${DELIVERY_WORKER_LEASE_TIMEOUT_MS:60000}

# FC-107(EPIC-SEARCH): 검색 질의·화해 설정(search-spec §12.4·§12.5·§12.7).
#   index-alias — 앱이 질의하는 읽기 alias(재색인은 이 alias 원자 스위치, 물리 인덱스명 미참조).
#   min/max-query-length — q 규약(계약 C3): 최소 2(ngram min_gram 정합)·최대 64(비용 상한). 위반 400(COMMON).
#   reconciliation — MySQL↔ES count+status+price histogram 드리프트 화해 워커(CDC 백스톱). enabled=true 운영 상시,
#     통합 테스트는 false. correct-on-drift=true 면 드리프트 시 bulk 재색인 보정(기본 false=탐지·경고만, 부하 큰 보정은
#     명시 활성). price-bucket-size — 가격 히스토그램 대조 버킷 폭(MySQL floor(price/size)*size ↔ ES histogram interval).
search:
  index-alias: ${SEARCH_INDEX_ALIAS:listings_search}
  min-query-length: 2
  max-query-length: 64
  # 부팅 시 전체 enrichment 재색인(코드축·join 필드 채움, MAJOR-1). 공통 기본 off(운영은 대량이라 명시 활성),
  #   로컬 데모는 application-local.yml 에서 on. 통합 테스트는 base 에서 off(ES 미기동).
  reindex-on-startup: ${SEARCH_REINDEX_ON_STARTUP:false}
  reindex:
    retain-old-index-minutes: ${SEARCH_REINDEX_RETAIN_OLD_INDEX_MINUTES:1440}
  reconciliation:
    enabled: ${SEARCH_RECONCILIATION_ENABLED:true}
    fixed-delay-ms: ${SEARCH_RECONCILIATION_FIXED_DELAY_MS:300000}
    correct-on-drift: ${SEARCH_RECONCILIATION_CORRECT_ON_DRIFT:false}
    price-bucket-size: ${SEARCH_RECONCILIATION_PRICE_BUCKET_SIZE:100000}

# FC-200(EPIC-BOARD): 게시글 이미지 오브젝트 스토리지(로컬 MinIO·운영 S3, board-domain-spec §7.6·§7.7). BoardImageStorageProperties 바인딩.
#   endpoint — S3 API 엔드포인트(로컬 MinIO=http://localhost:9000). 운영 S3 는 BOARD_IMAGE_ENDPOINT 로 실 엔드포인트를 주입한다.
#   presign-ttl — presigned GET 만료(ISO-8601 Duration, 기본 1시간). 게시판 이미지는 공개 콘텐츠라 인가 게이팅이 아닌 "버킷 비공개+안정 접근" 목적이라 넉넉히 둔다.
#   path-style — MinIO=true(path-style), 운영 S3=false 권장(virtual-hosted). ensure-bucket-on-startup — 앱 부팅 시 버킷 idempotent 확인·생성(로컬 런북 단순화, 통합 테스트 base 에서 off).
#   ★ access-key/secret-key(시크릿)는 여기 두지 않는다 — 공통에 기본값을 두면 운영이 상속받아 IAM 역할 fallback 이 무력화된다.
#     로컬 더미는 application-local.yml 에, 운영은 미주입(빈 값) → S3StoragePort 가 SDK 기본 자격증명 체인(IAM 역할)을 쓴다.
board:
  image:
    storage:
      endpoint: ${BOARD_IMAGE_ENDPOINT:http://localhost:9000}
      region: ${BOARD_IMAGE_REGION:us-east-1}
      bucket: ${BOARD_IMAGE_BUCKET:finalcall-board-images}
      presign-ttl: ${BOARD_IMAGE_PRESIGN_TTL:PT1H}
      path-style: ${BOARD_IMAGE_PATH_STYLE:true}
      ensure-bucket-on-startup: ${BOARD_IMAGE_ENSURE_BUCKET:true}

# D-068: 직접접근 차단(엣지 게이트웨이 공유비밀 검증). enforced 는 실 프로파일에서 항상 켠다.
#   secret 은 여기 두지 않는다(공통에 두면 prod fail-fast 무력화). application-<profile>.yml 참조.
#   ★ 통합테스트는 게이트웨이 미경유 MockMvc 직접 호출이라 enforced=false 로 내린다(테스트 base).
gateway:
  internal:
    enforced: ${GATEWAY_INTERNAL_ENFORCED:true}

# EPIC-CHAT(FC-320): STOMP는 server→client best-effort push 전용이다. Redis session guard 장애는
# node-local quota로 fail-open하며, WebSocket heartbeat보다 긴 lease TTL로 node crash 고아 lease를 정리한다.
chat:
  fast-path:
    workers: ${CHAT_FAST_PATH_WORKERS:4}
    queue-capacity: ${CHAT_FAST_PATH_QUEUE_CAPACITY:1024}
    shutdown-timeout: ${CHAT_FAST_PATH_SHUTDOWN_TIMEOUT:5s}
  # FC-326: 메시지 180일·신고 snapshot 3년·outbox 7일 보존. 각 tick은 데이터별 최대 batch-size만 삭제한다.
  # outbox는 최신 CDC checkpoint와 (7일+1일) 이상의 MySQL binlog 여유가 모두 확인될 때만 삭제한다.
  retention:
    enabled: ${CHAT_RETENTION_ENABLED:true}
    fixed-delay-ms: ${CHAT_RETENTION_FIXED_DELAY_MS:60000}
    batch-size: ${CHAT_RETENTION_BATCH_SIZE:200}
    message-age: 180d
    report-age: 1095d
    outbox-age: 7d
    cdc-checkpoint-max-age: 5m
    binlog-safety-margin: 1d
  realtime:
    connect-timeout: 5s
    heartbeat-interval: 10s
    inactivity-timeout: 30s
    socket-lease-ttl: 45s
    max-sockets-per-user: 3
    connect-rate-per-minute: 20
  # FC-321: production topic 전제는 replica 3/min ISR 2, metadata 7일 보존이다.
  #   local 단일 broker 값은 application-local.yml에서만 1/1로 내린다.
  kafka:
    topic:
      name: finalcall.chat.events.v1
      partitions: ${CHAT_KAFKA_TOPIC_PARTITIONS:12}
      replication-factor: ${CHAT_KAFKA_TOPIC_REPLICATION_FACTOR:3}
      min-in-sync-replicas: ${CHAT_KAFKA_TOPIC_MIN_ISR:2}
      retention: 7d
    consumer:
      enabled: false
      monitor-enabled: false
      group-id: finalcall-chat-fanout-v1
      retry-backoff: 1s
      monitor-interval: 10s
      monitor-timeout: 5s

# 주의: app.* 값은 공통에 두지 않는다. 프로파일별(application-<profile>.yml)에서 주입한다.
#       공통에 기본값을 두면 prod 도 상속받아 fail-fast 가 무력화되기 때문.

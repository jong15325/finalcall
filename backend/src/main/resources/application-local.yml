# local 프로파일: 모든 값에 기본값을 두어 환경변수 없이 즉시 실행된다.
# 시크릿/환경종속 값은 ${ENV:기본값} 형태 — 환경변수가 있으면 그 값, 없으면 기본값 사용.

app:
  name: ${APP_NAME:finalcall}
  description: ${APP_DESCRIPTION:게임 아이템 경매 플랫폼}

# Stage F1: JWT secret — local 기본값(${ENV:기본값}). ★ HS256 은 최소 256비트(32바이트) 필요.
#   운영 secret 은 절대 하드코딩/공유 금지. 아래 기본값은 로컬 전용 더미다.
jwt:
  secret: ${JWT_SECRET:finalcall-local-dev-secret-key-please-change-0123456789abcdef}

# D-068: 직접접근 차단 공유비밀 — local 기본값. ★ 게이트웨이(local) 기본값과 반드시 동일해야 경유가 성립한다.
#   운영 secret 은 절대 하드코딩/공유 금지. 아래 기본값은 로컬 전용 더미다.
gateway:
  internal:
    secret: ${GATEWAY_INTERNAL_SECRET:finalcall-local-gateway-shared-secret-change-me}

# Stage D: DataSource — local 은 ${ENV:기본값} 으로 환경변수 없이도 뜬다.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/finalcall}
    username: ${DB_USERNAME:finalcall}
    password: ${DB_PASSWORD:finalcall}
    hikari:
      # ★ 아래는 튜닝 대상 — 구체 수치는 DB 최대 커넥션·CPU·동시성 고려해 추후 설정(무작정 크게 금지).
      #   미설정 시 HikariCP 기본값 사용.
      # maximum-pool-size:   # 최대 커넥션 수(DB max_connections/CPU/동시성 고려)
      # minimum-idle:        # 최소 유휴 커넥션
      # connection-timeout:  # 커넥션 획득 대기(ms)
      # max-lifetime:        # 커넥션 최대 수명(ms), DB wait_timeout 보다 짧게

# Stage E1: Redis(Lettuce) — local 은 ${ENV:기본값}. Redisson 도 같은 host/port 를 바라본다(설정은 각각).
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# FC-084: 로컬 데모 시드 러너(LocalDemoSeeder) on/off. local 전용 개발 유틸이라 기본 on.
#   ★ 통합 테스트(@SpringBootTest)도 default 프로파일이 local 이라 이 러너가 뜨므로, 테스트 base 는
#     demo.seed.enabled=false 로 내려 시드가 테스트 데이터에 개입하지 못하게 한다(운영은 프로파일 게이트로 차단).
demo:
  seed:
    enabled: ${DEMO_SEED_ENABLED:true}
    # FC-144: 진행 중(ACTIVE) 경매 대량 시더(LocalActiveAuctionSeeder) on/off. 옵트인(기본 off) — 평상시 부팅에는
    #   뜨지 않고, 경매장 데모 데이터가 필요한 부팅에서만 DEMO_SEED_ACTIVE_AUCTIONS=true 로 켠다. 멱등(진행 중
    #   경매를 target 까지 top-up)이라 재실행해도 중복 폭증이 없다. 데이터는 MySQL/ES 에 영속된다.
    active-auctions:
      enabled: ${DEMO_SEED_ACTIVE_AUCTIONS:false}
      target: ${DEMO_SEED_ACTIVE_AUCTIONS_TARGET:100}

# EPIC-SEARCH(FC-107, MAJOR-1): 로컬 데모는 부팅 시 전체 enrichment 재색인을 켠다 — CDC(스냅샷 필드)에 더해
#   앱이 코드축·join 필드까지 채운 문서를 보장해 런북 스모크(GET /api/v1/auctions?q=...)가 실제 결과를 낸다.
#   드리프트 자동 보정도 켜 CDC 유실 시 주기 화해가 재색인하게 한다(데모 안정성).
search:
  reindex-on-startup: ${SEARCH_REINDEX_ON_STARTUP:true}
  reconciliation:
    correct-on-drift: ${SEARCH_RECONCILIATION_CORRECT_ON_DRIFT:true}

# EPIC-EMAIL-VERIFY(FC-130, FC-140): 로컬 기본은 발송 스킵(LoggingEmailSender, spec §6.3) — env 구동 옵트인.
#   기본값(false)이면 SMTP 미호출·생성 코드 로그. 크리덴셜 없이도 부팅·인증 흐름 테스트 가능.
#   실발송은 MAIL_SENDER_ENABLED=true + MAIL_USERNAME/MAIL_PASSWORD(네이버 앱 비밀번호) env 주입 시에만
#   SmtpEmailSender 활성(smtp.naver.com:465, application.yml 배선). ★ 시크릿은 커밋 금지·env only.
email:
  verify:
    sender-enabled: ${MAIL_SENDER_ENABLED:false}

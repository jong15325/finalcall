# 로컬 인프라 기동용. Stage 2~E1 은 MySQL/Redis 만, EPIC-SEARCH(FC-107) 부터 검색 스택
# (Elasticsearch(nori)·Kafka(KRaft)·Kafka Connect(Debezium MySQL source + ES sink))이 추가된다.
# 기동:   docker compose -f docker-compose.local.yml up -d
# 종료:   docker compose -f docker-compose.local.yml down
#
# ★ 검색 스택은 신규 컨테이너 3개 + MySQL binlog 설정으로 로컬 부담이 크다(search-spec v0.3 §12.1, 사용자
#   게이트2 승인 — 포트폴리오 사실성 우선). 무거우면 아래 elasticsearch heap 을 줄이거나 검색 스택만 프로필로 뺄 것.
# ★ 기동·커넥터 등록·색인 생성 절차는 docker/search/README.md(런북) 참조.
#
# ★ 아래 계정/비밀번호는 "로컬 개발 전용" 일회성 값이다.
#    실제 dev/prod 에는 절대 사용하지 말 것(운영 시크릿은 환경변수/시크릿 매니저로 주입).
#
# ★ 프로젝트명 고정(name): 이 파일은 `backend/` 아래에 있어 Compose 기본 프로젝트명이 디렉터리명 "backend"가
#   된다. 그러면 다른 레포의 `.../backend/docker-compose.yml`(예: On-Race)과 같은 "backend" 프로젝트로 뒤엉켜
#   컨테이너·네트워크·볼륨이 섞인다. 아래 name 으로 프로젝트를 "finalcall"에 고정해 격리한다(디렉터리 무관).
name: finalcall

services:
  mysql:
    image: mysql:8.0
    container_name: finalcall-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: finalcall
      MYSQL_USER: finalcall
      MYSQL_PASSWORD: finalcall
      MYSQL_ROOT_PASSWORD: root
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # EPIC-SEARCH(FC-107): Debezium CDC 를 위한 binlog 활성화(search-spec §12.1). ROW 포맷 + full row image 로
      #   변경 전/후 전체 컬럼을 캡처한다. server-id 는 복제 토폴로지 유일값(Debezium 이 replica 로 붙는다).
      #   ★ command 옵션이라 기존 데이터 볼륨(finalcall-mysql-data)을 보존한 채 재기동만으로 적용된다(초기화 없음).
      #   fresh volume은 docker-entrypoint-initdb.d의 SQL로 Debezium 캡처 계정과 권한을 자동 생성한다.
      #   기존 볼륨은 initdb를 재실행하지 않으므로 계정이 없다면 런북에 따라 SQL을 수동 1회 적용한다.
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=full
      - --server-id=1
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      # FC-321: outbox/Kafka 7일 보존보다 긴 14일 binlog 여유로 Connect 중단 backlog를 재생한다.
      - --binlog-expire-logs-seconds=1209600
      # ★ 운영 인스턴스 스펙 시뮬레이션(기본 무제한). 로컬 Docker 는 호스트 리소스를 다 써서
      #   "로컬은 되는데 작은 RDS 에선 커넥션 부족" 괴리가 생긴다. 타깃 인스턴스가 정해지면 주석을 풀어 시뮬레이션하라.
      #   예) db.t3.micro(1GB): max_connections≈66, buffer_pool 256M
      # - --max_connections=66
      # - --innodb_buffer_pool_size=256M
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "1.0"
    #       memory: 1g
    volumes:
      - finalcall-mysql-data:/var/lib/mysql
      - ./docker/search/mysql/debezium-user.sql:/docker-entrypoint-initdb.d/10-debezium-user.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: finalcall-redis
    ports:
      - "6379:6379"
    # ★ 운영 인스턴스 스펙 시뮬레이션(기본 무제한). 타깃이 정해지면 주석을 풀어라.
    #   예) cache.t4g.micro(0.5GB): maxmemory 400mb, 축출 정책 allkeys-lru
    # command:
    #   - redis-server
    #   - --maxmemory
    #   - 400mb
    #   - --maxmemory-policy
    #   - allkeys-lru
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512m
    volumes:
      - finalcall-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # EPIC-SEARCH(FC-107): 검색 read-model. nori(analysis-nori) + userdict 를 이미지에 구워 런타임 설치 취약성을
  #   피한다(search-spec §12.2). 로컬은 단일 노드·보안 off·heap 축소.
  elasticsearch:
    build:
      context: ./docker/search/elasticsearch
    image: finalcall-elasticsearch-nori:8.18.8
    container_name: finalcall-elasticsearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      # heap 축소(로컬 부담 완화). 데모 PC 메모리가 넉넉하면 512m~1g 로 조정.
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - finalcall-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # EPIC-SEARCH(FC-107): CDC 이벤트 버스. KRaft 단일 브로커(Zookeeper 없음, search-spec §12.1).
  kafka:
    image: apache/kafka:3.8.0
    container_name: finalcall-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # EPIC-CHAT(FC-321): metadata-only 채팅 topic. local 단일 broker라 replica/min ISR은 1이며,
  #   dev/prod는 app 설정과 인프라에서 replica 3/min ISR 2를 강제한다(chat-domain-spec §7.2).
  chat-kafka-topic-init:
    image: apache/kafka:3.8.0
    container_name: finalcall-chat-kafka-topic-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --create --if-not-exists --topic finalcall.chat.events.v1
        --partitions 12 --replication-factor 1
        --config retention.ms=604800000 --config min.insync.replicas=1
        --config cleanup.policy=delete
    restart: "no"

  # EPIC-SEARCH(FC-107): 커넥터 런타임. Debezium MySQL source(내장) + Confluent ES sink(Dockerfile 에서 추가).
  # FC-362: Kafka Connect 내부 토픽은 compact 정책이 필수다. 기존 볼륨에서도 멱등하게 생성·보정한다.
  search-kafka-connect-topic-init:
    image: apache/kafka:3.8.0
    container_name: finalcall-search-kafka-connect-topic-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - >-
        for topic_spec in connect-configs:1 connect-offsets:25 connect-status:5; do
          topic=$${topic_spec%%:*};
          partitions=$${topic_spec##*:};
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$${topic}" --partitions "$${partitions}" --replication-factor 1 --config cleanup.policy=compact;
          /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:9092 --alter --entity-type topics --entity-name "$${topic}" --add-config cleanup.policy=compact;
        done
    restart: "no"

  kafka-connect:
    build:
      context: ./docker/search/kafka-connect
    image: finalcall-kafka-connect:2.7
    container_name: finalcall-kafka-connect
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: finalcall-connect
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      search-kafka-connect-topic-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # EPIC-CHAT(FC-321): 검색 connector와 worker/offset/schema-history를 공유하지 않는 outbox 전용 Connect.
  #   Elasticsearch sink plugin도 싣지 않아 검색 SMT·sink 장애와 채팅 복구 경로를 격리한다.
  chat-kafka-connect:
    build:
      context: ./docker/chat/kafka-connect
    image: finalcall-chat-kafka-connect:2.7
    container_name: finalcall-chat-kafka-connect
    ports:
      - "8084:8083"
      - "9404:9404"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: finalcall-chat-connect
      CONFIG_STORAGE_TOPIC: chat-connect-configs
      OFFSET_STORAGE_TOPIC: chat-connect-offsets
      STATUS_STORAGE_TOPIC: chat-connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      KAFKA_OPTS: >-
        -javaagent:/kafka/jmx/jmx_prometheus_javaagent.jar=9404:/kafka/jmx/config.yml
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      chat-kafka-topic-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # PUT 등록이라 compose 재실행·connector 설정 변경에도 멱등 갱신된다.
  chat-outbox-connector-init:
    image: curlimages/curl:8.10.1
    container_name: finalcall-chat-outbox-connector-init
    entrypoint: ["/bin/sh", "/config/register-connector.sh"]
    volumes:
      - ./docker/chat/connectors:/config:ro
    depends_on:
      chat-kafka-connect:
        condition: service_healthy
    restart: "no"

  # EPIC-BOARD(FC-200): 게시글 이미지 오브젝트 스토리지(로컬 = MinIO, S3 API 호환). board-domain-spec §7.6 규격.
  #   비공개 버킷 finalcall-board-images 에 원본을 PUT 하고, 노출은 앱이 읽기 시점에 만드는 presigned GET URL 로만 한다
  #   (백엔드 프록시·공개-read 버킷 없음, §7.4). 버킷 생성은 앱 부팅 시 idempotent 확인·생성(BoardImageStorageConfig).
  #   ★ 아래 계정/비밀번호는 로컬 개발 전용 일회성 값 — 운영(S3)은 IAM 역할/시크릿 매니저로 주입(기본값 없음, fail-fast).
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: finalcall-minio
    ports:
      - "9000:9000"   # S3 API(앱·presigned 접근)
      - "9001:9001"   # 콘솔(로컬 확인용)
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-finalcall}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-finalcall-local}
    command: server /data --console-address ":9001"
    volumes:
      - finalcall-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  finalcall-mysql-data:
  finalcall-redis-data:
  finalcall-es-data:
  finalcall-minio-data:

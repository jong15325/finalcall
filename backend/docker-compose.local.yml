# 로컬 인프라 기동용. Stage 2~E1 은 MySQL/Redis 만, EPIC-SEARCH(FC-107) 부터 검색 스택
# (Elasticsearch(nori)·Kafka(KRaft)·Kafka Connect(Debezium MySQL source + ES sink))이 추가된다.
# 기동:   docker compose -f docker-compose.local.yml up -d
# 종료:   docker compose -f docker-compose.local.yml down
#
# ★ 검색 스택은 신규 컨테이너 3개 + MySQL binlog 설정으로 로컬 부담이 크다(search-spec v0.3 §12.1, 사용자
#   게이트2 승인 — 포트폴리오 사실성 우선). 무거우면 아래 elasticsearch heap 을 줄이거나 검색 스택만 프로필로 뺄 것.
# ★ 기동·커넥터 등록·색인 생성 절차는 docker/search/README.md(런북) 참조.
#
# ★ 아래 계정/비밀번호는 "로컬 개발 전용" 일회성 값이다.
#    실제 dev/prod 에는 절대 사용하지 말 것(운영 시크릿은 환경변수/시크릿 매니저로 주입).
#
# ★ 프로젝트명 고정(name): 이 파일은 `backend/` 아래에 있어 Compose 기본 프로젝트명이 디렉터리명 "backend"가
#   된다. 그러면 다른 레포의 `.../backend/docker-compose.yml`(예: On-Race)과 같은 "backend" 프로젝트로 뒤엉켜
#   컨테이너·네트워크·볼륨이 섞인다. 아래 name 으로 프로젝트를 "finalcall"에 고정해 격리한다(디렉터리 무관).
name: finalcall

services:
  mysql:
    image: mysql:8.0
    container_name: finalcall-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: finalcall
      MYSQL_USER: finalcall
      MYSQL_PASSWORD: finalcall
      MYSQL_ROOT_PASSWORD: root
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # EPIC-SEARCH(FC-107): Debezium CDC 를 위한 binlog 활성화(search-spec §12.1). ROW 포맷 + full row image 로
      #   변경 전/후 전체 컬럼을 캡처한다. server-id 는 복제 토폴로지 유일값(Debezium 이 replica 로 붙는다).
      #   ★ command 옵션이라 기존 데이터 볼륨(finalcall-mysql-data)을 보존한 채 재기동만으로 적용된다(초기화 없음).
      #   Debezium 캡처 계정 생성·권한 부여(REPLICATION SLAVE/CLIENT)는 docker/search/mysql/debezium-user.sql 을
      #   기존 볼륨에 수동 적용한다(초기 볼륨이 아니라 docker-entrypoint-initdb.d 자동 실행이 안 되므로, 런북 참조).
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=full
      - --server-id=1
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      # ★ 운영 인스턴스 스펙 시뮬레이션(기본 무제한). 로컬 Docker 는 호스트 리소스를 다 써서
      #   "로컬은 되는데 작은 RDS 에선 커넥션 부족" 괴리가 생긴다. 타깃 인스턴스가 정해지면 주석을 풀어 시뮬레이션하라.
      #   예) db.t3.micro(1GB): max_connections≈66, buffer_pool 256M
      # - --max_connections=66
      # - --innodb_buffer_pool_size=256M
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "1.0"
    #       memory: 1g
    volumes:
      - finalcall-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: finalcall-redis
    ports:
      - "6379:6379"
    # ★ 운영 인스턴스 스펙 시뮬레이션(기본 무제한). 타깃이 정해지면 주석을 풀어라.
    #   예) cache.t4g.micro(0.5GB): maxmemory 400mb, 축출 정책 allkeys-lru
    # command:
    #   - redis-server
    #   - --maxmemory
    #   - 400mb
    #   - --maxmemory-policy
    #   - allkeys-lru
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512m
    volumes:
      - finalcall-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # EPIC-SEARCH(FC-107): 검색 read-model. nori(analysis-nori) + userdict 를 이미지에 구워 런타임 설치 취약성을
  #   피한다(search-spec §12.2). 로컬은 단일 노드·보안 off·heap 축소.
  elasticsearch:
    build:
      context: ./docker/search/elasticsearch
    image: finalcall-elasticsearch-nori:8.18.8
    container_name: finalcall-elasticsearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      # heap 축소(로컬 부담 완화). 데모 PC 메모리가 넉넉하면 512m~1g 로 조정.
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - finalcall-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # EPIC-SEARCH(FC-107): CDC 이벤트 버스. KRaft 단일 브로커(Zookeeper 없음, search-spec §12.1).
  kafka:
    image: apache/kafka:3.8.0
    container_name: finalcall-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # EPIC-SEARCH(FC-107): 커넥터 런타임. Debezium MySQL source(내장) + Confluent ES sink(Dockerfile 에서 추가).
  kafka-connect:
    build:
      context: ./docker/search/kafka-connect
    image: finalcall-kafka-connect:2.7
    container_name: finalcall-kafka-connect
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: finalcall-connect
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  finalcall-mysql-data:
  finalcall-redis-data:
  finalcall-es-data:

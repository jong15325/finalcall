# SCG 엣지 게이트웨이 공통 설정(D-068). 활성 프로파일은 하드코딩하지 않는다(SPRING_PROFILES_ACTIVE 로만).
# 게이트웨이 포트는 서비스(8080)와 구분해 엣지 진입점으로 8000 을 쓴다.
# 시크릿/환경종속 값(공유비밀·Redis·하류 주소)은 공통에 두지 않고 프로파일별로 주입한다
#   (공통에 기본값을 두면 prod fail-fast 가 무력화되기 때문).
server:
  port: ${GATEWAY_PORT:8000}
  # 실제 peer 주소를 보존한다. Forwarded/XFF 신뢰는 아래 고정 hop resolver 한 곳에서만 수행한다.
  forward-headers-strategy: none

spring:
  application:
    name: finalcall-gateway
  profiles:
    default: local
  cloud:
    gateway:
      server:
        webflux:
          # 라우팅: 단일 서비스로 경로 기반 프록시. 목록 순서대로 매칭되므로 rate limit 대상(auth)을 먼저 둔다.
          # 하류 주소는 스칼라 placeholder(${service.uri})로 참조한다 — 라우트 목록은 프로파일 간 병합이 아니라
          # 전체 치환되므로, 목록은 공통에 한 번만 정의하고 주소만 프로파일별 변수로 주입한다.
          routes:
            # FC-320: native WebSocket/STOMP handshake. HTTP API route보다 먼저 매칭하고 IP당
            # 10회/분, burst 5 토큰버킷을 적용한다(10 token/s, 요청당 60, capacity 300).
            - id: chat-websocket-rate-limited
              uri: ${service.ws-uri}
              predicates:
                - Path=/ws/chat
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 300
                    redis-rate-limiter.requestedTokens: 60
            # FC-325: 영속 메시지 POST 전용 IP당 120회/분 1차 방어. Method predicate와 낮은 order로
            # 같은 path의 GET 및 일반 service-proxy와 분리한다(초당 2개 보충, burst 120).
            - id: chat-message-post-rate-limited
              order: -20
              uri: ${service.uri}
              predicates:
                - Path=/api/v1/me/chat-rooms/{roomPublicId}/messages
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 2
                    redis-rate-limiter.burstCapacity: 120
                    redis-rate-limiter.requestedTokens: 1
            # 인증 계열(login/signup/refresh) — Redis 토큰버킷 rate limit 우선 적용(SEC-005).
            - id: auth-rate-limited
              uri: ${service.uri}
              predicates:
                - Path=/api/v1/auth/login,/api/v1/auth/signup,/api/v1/auth/refresh,/api/v1/auth/nickname/availability,/api/v1/auth/oauth/**,/api/v1/auth/login-id/availability
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    # 토큰버킷: 초당 보충 5개, 최대 버스트 10개, 요청당 1토큰(데모값 — 실측으로 조정).
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1
            # 그 외 서비스 API 는 rate limit 없이 프록시(엣지는 라우팅·직접접근 차단만 담당).
            # FC-415: 홈 추천 공개 read 전용 IP 토큰버킷. 정확 경로 GET만 일반 proxy보다 먼저 매칭한다.
            - id: home-shop-recommendations-rate-limited
              order: -30
              uri: ${service.uri}
              predicates:
                - Path=/api/v1/home/shop-recommendations
                - Method=GET
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    rate-limiter: "#{@homeRecommendationRateLimiter}"
                    redis-rate-limiter.replenishRate: ${gateway.home-recommend-rate-limit.replenish-rate}
                    redis-rate-limiter.burstCapacity: ${gateway.home-recommend-rate-limit.burst-capacity}
                    redis-rate-limiter.requestedTokens: ${gateway.home-recommend-rate-limit.requested-tokens}
            - id: service-proxy
              uri: ${service.uri}
              predicates:
                - Path=/api/v1/**

# 엣지 게이트웨이 공유비밀(직접접근 차단). 하류 요청에 X-Gateway-Token 으로 부착된다.
#   header 는 무해한 상수라 공통에 둔다. secret 은 프로파일별 주입(공통 금지).
gateway:
  internal:
    header: X-Gateway-Token
  client-ip:
    # 0은 모든 Forwarded/XFF를 무시하는 안전 기본값이다. 앞단 프록시가 헤더를 append하도록
    # 통제된 배포에서만 실제 hop 수를 설정한다. resolver는 우측 고정 위치만 신뢰한다.
    trusted-proxy-count: ${GATEWAY_TRUSTED_PROXY_COUNT:0}
  home-recommend-rate-limit:
    replenish-rate: ${HOME_RECOMMEND_RATE_LIMIT_REPLENISH_RATE:1}
    burst-capacity: ${HOME_RECOMMEND_RATE_LIMIT_BURST_CAPACITY:10}
    requested-tokens: ${HOME_RECOMMEND_RATE_LIMIT_REQUESTED_TOKENS:1}

# 엣지 운영 관심사(헬스 체크). 화이트리스트만 노출.
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

// D-068: SCG 엣지 게이트웨이 서브프로젝트.
//   루트 서비스(서블릿/JPA)와 완전히 독립된 WebFlux(reactive) 스택 — 별도 배포 산출물.
//   플러그인은 루트와 동일 버전으로 자체 선언한다(루트가 서비스 앱 자체라 subprojects 상속 대신 자립 구성).
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    // 코드 스타일(B-020): 게이트웨이 모듈도 동일 룰셋 적용(루트 config 파일 재사용).
    id 'checkstyle'
    id 'com.diffplug.spotless' version '6.25.0'
}

group = 'com.finalcall'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// Spring Boot 3.5.x 정합 릴리스 트레인.
ext {
    springCloudVersion = '2025.0.0'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    // SCG(WebFlux 기반 리액티브 게이트웨이). 서블릿 web/JPA 는 넣지 않는다.
    // 2025.0.0(Northfields)에서 spring-cloud-starter-gateway 는 deprecated → server-webflux 스타터로 이관.
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
    // RequestRateLimiter(Redis 토큰버킷)는 리액티브 Redis 를 사용한다.
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    // @ConfigurationProperties(공유비밀) 의 @Validated/@NotBlank 검증(fail-fast) 활성화.
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // 헬스 체크 등 엣지 운영 관심사(엔드포인트 노출은 application.yml 화이트리스트).
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    // 델타 3: 버스트 초과 429 동적 검증 — 실제 Redis(RequestRateLimiter 토큰버킷) 필요. 버전은 BOM 관리.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// B-020: Checkstyle — 루트 Naver 룰셋 재사용(멀티모듈 공통 스타일).
checkstyle {
    toolVersion = '10.20.2'
    configFile = rootProject.file('config/checkstyle/naver-checkstyle-rules.xml')
    configProperties = [suppressionFile: rootProject.file('config/checkstyle/naver-checkstyle-suppressions.xml')]
    maxWarnings = 0
}

// B-020: Spotless — 루트 Naver eclipse formatter(스페이스4) + import 순서 재사용.
spotless {
    lineEndings = com.diffplug.spotless.LineEnding.UNIX
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
        eclipse().configFile(rootProject.file('config/naver-eclipse-formatter.xml'))
        importOrder('\\#', 'java', 'javax', 'org', 'net', 'com')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'   // 한국어 주석/메시지 안전.
}

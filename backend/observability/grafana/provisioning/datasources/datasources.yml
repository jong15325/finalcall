# Stage G: Grafana 데이터소스 자동 연결(수동 클릭 없이 바로 사용).
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    # ★ 선택 확장: derivedFields 로 traceId 를 파생 필드로 만들어 로그↔추적(Tempo 등) 상관관계 링크 가능.
    #   현재는 span export off(Stage 4)라 Tempo 미연동 — traceId 는 LogQL 로 검색만.
